<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogged bottle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2FF;
    --text: #1A1240;
    --text2: #4E4777;
    --pink: #EC1C7F;
    --blue: #2A47EA;
    --orange: #FF7A00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .stage { position: relative; width: 100%; height: 100svh; min-height: 540px; overflow: hidden; touch-action: pan-y; background: var(--bg); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: crosshair; }
  .ui { position: absolute; left: 16px; bottom: 16px; right: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  button { font: inherit; font-weight: 700; font-size: 1rem; color: var(--text); background: var(--bg); border: 2px solid var(--text); border-radius: 999px; padding: 10px 20px; min-height: 44px; cursor: pointer; }
  button:hover { background: #fff; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .hint { margin: 0; font-size: 0.95rem; color: var(--text2); background: var(--bg); padding: 8px 14px; border-radius: 999px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="sr">Fogged bottle: wipe the fog from a pane of glass</h1>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="ui">
    <button id="toggle" type="button" aria-pressed="false">Pause</button>
    <p class="hint" id="hint">Drag across the glass to wipe the fog away.</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  var COL = { bg: '#F4F2FF', text: '#1A1240', pink: '#EC1C7F', blue: '#2A47EA', orange: '#FF7A00' };
  var CELL = 4, BLUR = 16, NAME = 'Your brand';
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var btn = document.getElementById('toggle');
  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');

  var W = 0, H = 0, dpr = 1, gw = 0, gh = 0;
  var fog, fogTmp, imgData;
  var sharp, fogFull, fogHalf, tmp, mask, maskCtx, tmpCtx;
  var drips = [];
  var playing = !mq.matches, visible = true, dirty = true, rafId = 0, last = 0;
  var ptr = { down: false, x: 0, y: 0, acc: 0 };

  function mk(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
  function smooth(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }

  function drawScene(g, w, h) {
    var a = 135 * Math.PI / 180, cx = w / 2, cy = h / 2;
    var dx = Math.cos(a) * w / 2, dy = Math.sin(a) * h / 2;
    var gr = g.createLinearGradient(cx - dx, cy - dy, cx + dx, cy + dy);
    gr.addColorStop(0, COL.pink); gr.addColorStop(0.5, COL.blue); gr.addColorStop(1, COL.orange);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    var s = Math.min(w, h);
    var circles = [[0.2, 0.3, 0.5, COL.orange], [0.8, 0.25, 0.45, COL.pink], [0.55, 0.85, 0.55, COL.blue]];
    g.globalCompositeOperation = 'multiply';
    g.globalAlpha = 0.8;
    for (var i = 0; i < circles.length; i++) {
      var c = circles[i];
      g.fillStyle = c[3];
      g.beginPath(); g.arc(c[0] * w, c[1] * h, c[2] * s, 0, Math.PI * 2); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    var size = Math.min(h * 0.22, w * 0.9 / NAME.length / 0.6);
    g.font = '900 ' + size + 'px Anybody, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = COL.text;
    g.fillText(NAME, w / 2, h / 2);
  }

  function buildLayers() {
    // sharp scene at device resolution
    sharp = mk(W * dpr, H * dpr);
    var sg = sharp.getContext('2d');
    sg.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScene(sg, W, H);
    // blurred copy: draw at 1/BLUR size, scale up by doubling with smoothing
    var cur = mk(W / BLUR, H / BLUR);
    var cg = cur.getContext('2d');
    cg.scale(cur.width / W, cur.height / H);
    drawScene(cg, W, H);
    while (cur.width < W) {
      var nw = Math.min(cur.width * 2, Math.ceil(W)), nh = Math.min(cur.height * 2, Math.ceil(H));
      var n = mk(nw, nh), ng = n.getContext('2d');
      ng.imageSmoothingEnabled = true; ng.imageSmoothingQuality = 'high';
      ng.drawImage(cur, 0, 0, n.width, n.height);
      cur = n;
    }
    fogFull = mk(W, H);
    var fg = fogFull.getContext('2d');
    fg.imageSmoothingEnabled = true;
    fg.drawImage(cur, 0, 0, W, H);
    fg.globalAlpha = 0.8; fg.fillStyle = COL.bg; fg.fillRect(0, 0, W, H); fg.globalAlpha = 1;
    // half-size fogged copy
    fogHalf = mk(W * 0.5, H * 0.5);
    var hg = fogHalf.getContext('2d');
    hg.imageSmoothingEnabled = true; hg.imageSmoothingQuality = 'high';
    hg.drawImage(fogFull, 0, 0, fogHalf.width, fogHalf.height);
    tmp = mk(fogHalf.width, fogHalf.height); tmpCtx = tmp.getContext('2d');
  }

  function resetFog() {
    gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
    fog = new Float32Array(gw * gh).fill(1);
    fogTmp = new Float32Array(gw * gh);
    mask = mk(gw, gh); maskCtx = mask.getContext('2d');
    imgData = maskCtx.createImageData(gw, gh);
    for (var i = 0; i < gw * gh; i++) { imgData.data[i * 4 + 3] = 255; }
    drips = [];
  }

  function wipe(x, y, R) {
    var x0 = Math.max(0, Math.floor((x - R) / CELL)), x1 = Math.min(gw - 1, Math.floor((x + R) / CELL));
    var y0 = Math.max(0, Math.floor((y - R) / CELL)), y1 = Math.min(gh - 1, Math.floor((y + R) / CELL));
    for (var j = y0; j <= y1; j++) {
      for (var i = x0; i <= x1; i++) {
        var d = Math.hypot(i * CELL + CELL / 2 - x, j * CELL + CELL / 2 - y);
        var v = smooth((d - R * (1 - 0.45)) / (R * 0.45));
        var k = j * gw + i;
        if (v < fog[k]) fog[k] = v;
      }
    }
    dirty = true;
  }

  function clearLine(x, ya, yb, hw) {
    var x0 = Math.max(0, Math.floor((x - hw) / CELL)), x1 = Math.min(gw - 1, Math.floor((x + hw) / CELL));
    var y0 = Math.max(0, Math.floor(Math.min(ya, yb) / CELL)), y1 = Math.min(gh - 1, Math.floor(Math.max(ya, yb) / CELL));
    for (var j = y0; j <= y1; j++) for (var i = x0; i <= x1; i++) fog[j * gw + i] = 0;
    dirty = true;
  }

  function radius() { return W * 0.06 / 2; }

  function wipeTo(x, y) {
    var R = radius();
    var dx = x - ptr.x, dy = y - ptr.y, dist = Math.hypot(dx, dy);
    var step = 4, n = Math.max(1, Math.ceil(dist / step));
    for (var s = 1; s <= n; s++) {
      var px = ptr.x + dx * s / n, py = ptr.y + dy * s / n;
      wipe(px, py, R);
    }
    ptr.acc += dist;
    while (ptr.acc >= 150) {
      ptr.acc -= 150;
      if (Math.random() < 0.3) {
        drips.push({ x: x, y: y + R * 0.6, run: 0, max: H * (0.15 + Math.random() * 0.15) });
      }
    }
    ptr.x = x; ptr.y = y;
  }

  function step(dt) {
    // creep back
    var any = false, i, j, k, m;
    fogTmp.set(fog);
    for (j = 0; j < gh; j++) {
      for (i = 0; i < gw; i++) {
        k = j * gw + i;
        var f = fogTmp[k];
        if (f >= 1) continue;
        m = 0;
        if (i > 0 && fogTmp[k - 1] > m) m = fogTmp[k - 1];
        if (i < gw - 1 && fogTmp[k + 1] > m) m = fogTmp[k + 1];
        if (j > 0 && fogTmp[k - gw] > m) m = fogTmp[k - gw];
        if (j < gh - 1 && fogTmp[k + gw] > m) m = fogTmp[k + gw];
        f += dt / 6 * (0.3 + (1 - 0.3) * m);
        if (f > 1) f = 1;
        fog[k] = f;
        any = true;
      }
    }
    // drips
    for (i = drips.length - 1; i >= 0; i--) {
      var d = drips[i];
      var adv = Math.min(80 * dt, d.max - d.run);
      clearLine(d.x, d.y + d.run, d.y + d.run + adv, 3);
      d.run += adv;
      if (d.run >= d.max) drips.splice(i, 1);
    }
    if (any || drips.length) dirty = true;
  }

  function render() {
    var i, n = gw * gh, data = imgData.data;
    for (i = 0; i < n; i++) data[i * 4 + 3] = Math.round(fog[i] * 255);
    maskCtx.putImageData(imgData, 0, 0);
    tmpCtx.globalCompositeOperation = 'source-over';
    tmpCtx.clearRect(0, 0, tmp.width, tmp.height);
    tmpCtx.drawImage(fogHalf, 0, 0);
    tmpCtx.globalCompositeOperation = 'destination-in';
    tmpCtx.imageSmoothingEnabled = true;
    tmpCtx.drawImage(mask, 0, 0, tmp.width, tmp.height);
    tmpCtx.globalCompositeOperation = 'source-over';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sharp, 0, 0, W, H);
    ctx.drawImage(tmp, 0, 0, W, H);
    // beads, batched into one path
    if (drips.length) {
      ctx.beginPath();
      for (i = 0; i < drips.length; i++) {
        var d = drips[i];
        ctx.moveTo(d.x + 4, d.y + d.run);
        ctx.arc(d.x, d.y + d.run, 4, 0, Math.PI * 2);
      }
      ctx.globalAlpha = 0.8; ctx.fillStyle = COL.bg; ctx.fill();
      ctx.globalAlpha = 0.25; ctx.strokeStyle = COL.text; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    dirty = false;
  }

  function still() {
    fog.fill(1); drips = [];
    var R = radius(), by = H * 0.5;
    for (var x = W * 0.15; x <= W * 0.85; x += 4) wipe(x, by, R);
    var runs = [[0.3, 0.14000000000000002], [0.6, 0.1]];
    for (var i = 0; i < runs.length; i++) {
      var dx = W * runs[i][0], run = H * runs[i][1];
      clearLine(dx, by, by + run, 3);
      drips.push({ x: dx, y: by, run: run, max: run });
    }
    render();
  }

  function frame(t) {
    rafId = 0;
    if (!playing || !visible) return;
    var dt = Math.min((t - last) / 1000, 0.05); last = t;
    if (dt < 0) dt = 0;
    step(dt);
    if (dirty) render();
    rafId = requestAnimationFrame(frame);
  }
  function kick() {
    if (playing && visible && !rafId) { last = performance.now(); rafId = requestAnimationFrame(frame); }
  }

  function setPlaying(p) {
    playing = p;
    btn.textContent = p ? 'Pause' : 'Play';
    btn.setAttribute('aria-pressed', String(!p));
    document.getElementById('hint').textContent = p ? 'Drag across the glass to wipe the fog away.' : 'Paused. Press Play to wipe the fog.';
    if (p) kick(); else if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  function layout() {
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    var d = Math.min(window.devicePixelRatio || 1, 2);
    if (w === W && h === H && d === dpr) return;
    W = w; H = h; dpr = d;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    buildLayers(); resetFog();
    if (!playing) still(); else { dirty = true; render(); }
    kick();
  }

  function pos(e) { var r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  canvas.addEventListener('pointerenter', function (e) { var p = pos(e); ptr.x = p[0]; ptr.y = p[1]; ptr.down = true; });
  canvas.addEventListener('pointerdown', function (e) { var p = pos(e); ptr.x = p[0]; ptr.y = p[1]; ptr.down = true; });
  canvas.addEventListener('pointermove', function (e) {
    if (!ptr.down || !playing) { var q = pos(e); ptr.x = q[0]; ptr.y = q[1]; return; }
    var p = pos(e); wipeTo(p[0], p[1]);
    if (!playing || !visible) return;
  });
  function up() { ptr.down = false; }
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  btn.addEventListener('click', function () { setPlaying(!playing); if (!playing) still(); });
  mq.addEventListener && mq.addEventListener('change', function (e) { setPlaying(!e.matches); if (e.matches) still(); });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      visible = es[0].isIntersecting;
      if (visible) kick(); else if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    }).observe(stage);
  }
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);

  btn.textContent = playing ? 'Pause' : 'Play';
  btn.setAttribute('aria-pressed', String(!playing));
  layout();
  if (!playing) { document.getElementById('hint').textContent = 'Paused. Press Play to wipe the fog.'; still(); }
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 40px Anybody').then(function () {
      var keep = fog.slice(), kd = drips.slice();
      buildLayers();
      if (!playing) still(); else { fog.set(keep); drips = kd; dirty = true; render(); }
    }, function () {});
  }
})();
</script>
</body>
</html>
