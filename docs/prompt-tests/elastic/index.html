<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stretchy Headline</title>

  <!-- The "Anybody" variable font: width 50–150, weight 100–900 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap">

  <style>
    /* ---------- "Riso" palette ---------- */
    :root {
      --bg: #F4F2FF;       /* paper */
      --ink: #1A1240;      /* main text */
      --ink-2: #4E4777;    /* secondary text */
      --pink: #EC1C7F;     /* accent 1 */
      --blue: #2A47EA;     /* accent 2 */
      --orange: #FF7A00;   /* accent 3 */
      --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    /* Text that only screen readers can "see" */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- The full-screen section ---------- */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;          /* fallback for older browsers */
      height: 100svh;
      min-height: 540px;
      overflow: hidden;
      background: var(--bg);
      touch-action: pan-y;    /* sideways drags go to us, vertical swipes still scroll */
      isolation: isolate;     /* keeps the "multiply" ink blending inside this section */
    }

    /* ---------- The stretchy headline ---------- */
    .headline {
      margin: 0 0 6vh;        /* lifts the line above the middle */
      font-size: clamp(4.5rem, 21vw, 19rem);
      line-height: 0.9;
      font-weight: 550;
      color: var(--ink);
      white-space: nowrap;    /* always a single line */
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .word {
      display: inline-block;
      white-space: nowrap;
    }

    .ch {
      display: inline-block;
      /* Shadows of neighbouring letters overprint like ink on paper */
      mix-blend-mode: multiply;
    }

    /* ---------- Hint and Play/Pause button ---------- */
    .controls {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: clamp(20px, 6vh, 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .hint {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink-2);
    }

    /* Three little overlapping ink dots, multiplied like riso print */
    .dots {
      position: relative;
      display: inline-block;
      width: 1.6em;
      height: 0.8em;
      flex: none;
    }
    .dots i {
      position: absolute;
      top: 0;
      width: 0.8em;
      height: 0.8em;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }
    .dots i:nth-child(1) { left: 0;      background: var(--pink); }
    .dots i:nth-child(2) { left: 0.4em;  background: var(--blue); }
    .dots i:nth-child(3) { left: 0.8em;  background: var(--orange); }

    .hint-touch,
    .hint-paused { display: none; }

    /* On touch screens, show the touch hint instead */
    @media (hover: none) {
      .hint-mouse { display: none; }
      .hint-touch { display: inline; }
    }

    /* While paused, explain how to start again */
    .stage.is-paused .hint-mouse,
    .stage.is-paused .hint-touch { display: none; }
    .stage.is-paused .hint-paused { display: inline; }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55em;
      min-height: 44px;
      padding: 0.55em 1.2em;
      font: inherit;
      font-size: 1rem;
      font-weight: 650;
      color: var(--ink);
      background: transparent;
      border: 2px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
    }
    .toggle:hover {
      background: var(--ink);
      color: var(--bg);
    }
    .toggle:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .toggle svg {
      width: 0.85em;
      height: 0.85em;
      fill: currentColor;
    }
    .toggle .icon-play { display: none; }
    .toggle.is-paused .icon-play { display: block; }
    .toggle.is-paused .icon-pause { display: none; }
  </style>
</head>
<body>
  <main>
    <section class="stage" id="stage" aria-label="Stretchy headline">
      <h1 class="headline">
        <span class="sr-only">elastic</span>
        <!-- JavaScript splits this word into one span per letter -->
        <span class="word" id="word" aria-hidden="true">elastic</span>
      </h1>

      <div class="controls">
        <p class="hint">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="hint-mouse">Move your cursor across the word</span>
          <span class="hint-touch">Drag sideways across the word</span>
          <span class="hint-paused">Paused. Press Play to bring the letters to life</span>
        </p>
        <button type="button" class="toggle" id="toggle">
          <svg class="icon-pause" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="0" width="3" height="10"/><rect x="6" y="0" width="3" height="10"/></svg>
          <svg class="icon-play" viewBox="0 0 10 10" aria-hidden="true"><polygon points="1,0 10,5 1,10"/></svg>
          <span class="toggle-label">Pause</span>
        </button>
      </div>
    </section>
  </main>

  <script>
  (function () {
    "use strict";

    var PINK = "#EC1C7F";   // first accent  (shadow down-right)
    var BLUE = "#2A47EA";   // second accent (shadow up-left)

    var stage = document.getElementById("stage");
    var word = document.getElementById("word");
    var toggle = document.getElementById("toggle");
    var toggleLabel = toggle.querySelector(".toggle-label");

    // ---------- 1. Split the word into one span per letter ----------
    var text = word.textContent.trim();
    word.textContent = "";
    var letters = [];
    Array.from(text).forEach(function (char) {
      var span = document.createElement("span");
      span.className = "ch";
      span.setAttribute("aria-hidden", "true");
      span.textContent = char;
      word.appendChild(span);
      letters.push({ el: span, v: 0.5, key: "" }); // influence starts at 0.5
    });
    var count = letters.length;

    // ---------- 2. Helpers ----------
    function round4(x) { return Math.round(x * 10000) / 10000; }

    // The slow "idle" wave: (0.5 + 0.5·sin(t·2.1 − i·0.85))²
    function idleTarget(i, t) {
      var s = 0.5 + 0.5 * Math.sin(t * 2.1 - i * 0.85);
      return s * s;
    }

    // Turn each letter's influence v (0..1) into width, weight, shadow and lift
    function paint() {
      for (var i = 0; i < count; i++) {
        var L = letters[i];
        var v = Math.min(1, Math.max(0, L.v));
        var wdth = (50 + v * 100).toFixed(1);
        var wght = Math.round(200 + v * 700);
        var sx = round4(0.045 * v);
        var sy = round4(0.03 * v);
        var ty = round4(-0.05 * v);

        // Skip the style write if nothing visible changed since last frame
        var key = wdth + "|" + wght + "|" + sx + "|" + sy + "|" + ty;
        if (key === L.key) continue;
        L.key = key;

        var st = L.el.style;
        st.fontVariationSettings = '"wdth" ' + wdth + ', "wght" ' + wght;
        st.fontWeight = String(wght);
        st.textShadow =
          sx + "em " + sy + "em 0 " + PINK + ", " +
          (-sx) + "em " + (-sy) + "em 0 " + BLUE;
        st.transform = "translateY(" + ty + "em)";
      }
    }

    // ---------- 3. Pointer tracking ----------
    var pointer = { x: 0, active: false };

    function pointerOn(e) {
      pointer.x = e.clientX;
      pointer.active = true;
    }
    function pointerOff() {
      pointer.active = false;
    }

    stage.addEventListener("pointermove", pointerOn);
    stage.addEventListener("pointerdown", pointerOn);
    stage.addEventListener("pointerleave", pointerOff);
    stage.addEventListener("pointercancel", pointerOff);
    stage.addEventListener("pointerup", function (e) {
      if (e.pointerType === "touch") pointerOff(); // lifting a finger
    });

    // ---------- 4. The single animation loop ----------
    var rafId = 0;
    var lastTime = 0;   // timestamp of the previous frame
    var t = 0;          // seconds the loop has run (sum of dt)
    var playing = true;
    var onScreen = true;

    function frame(now) {
      rafId = requestAnimationFrame(frame);

      var dt = lastTime ? (now - lastTime) / 1000 : 0;
      lastTime = now;
      dt = Math.min(Math.max(dt, 0), 0.05);
      t += dt;

      var ease = 1 - Math.exp(-dt * 9);
      var i, target;

      if (pointer.active) {
        // Measure the word, split its width evenly between the letters
        var box = word.getBoundingClientRect();
        var step = box.width / count;
        for (i = 0; i < count; i++) {
          if (step > 0) {
            var k = (box.left + step * (i + 0.5) - pointer.x) / (step * 1.25);
            target = Math.exp(-k * k);
          } else {
            target = idleTarget(i, t);
          }
          letters[i].v += (target - letters[i].v) * ease;
        }
      } else {
        for (i = 0; i < count; i++) {
          target = idleTarget(i, t);
          letters[i].v += (target - letters[i].v) * ease;
        }
      }

      paint();
    }

    function start() {
      if (rafId || !playing || !onScreen) return;
      lastTime = 0;
      rafId = requestAnimationFrame(frame);
    }

    function stop() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
    }

    // ---------- 5. Play / Pause ----------
    function setPlaying(next) {
      playing = next;
      toggleLabel.textContent = next ? "Pause" : "Play";
      toggle.classList.toggle("is-paused", !next);
      stage.classList.toggle("is-paused", !next);
      if (next) start(); else stop();
    }

    toggle.addEventListener("click", function () {
      setPlaying(!playing);
    });

    // A meaningful still frame: every letter at the idle-wave value for t = 0.4
    function showStillFrame() {
      for (var i = 0; i < count; i++) letters[i].v = idleTarget(i, 0.4);
      paint();
    }

    // ---------- 6. Reduced motion: start paused on a still frame ----------
    var reduceMotion = window.matchMedia
      ? window.matchMedia("(prefers-reduced-motion: reduce)")
      : null;

    if (reduceMotion && reduceMotion.matches) {
      showStillFrame();
      setPlaying(false);
    } else {
      paint();          // draw the starting state right away (v = 0.5)
      setPlaying(true);
    }

    if (reduceMotion) {
      var onMotionChange = function (e) {
        if (e.matches) {
          setPlaying(false);
          showStillFrame();
        }
      };
      if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", onMotionChange);
      else if (reduceMotion.addListener) reduceMotion.addListener(onMotionChange);
    }

    // ---------- 7. Pause while the section is off-screen ----------
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[0].isIntersecting;
        if (onScreen) start(); else stop();
      }).observe(stage);
    }
  })();
  </script>
</body>
</html>
