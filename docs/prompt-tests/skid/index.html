<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skid</title>
<meta name="description" content="A headline whose letters drive in, skid to a stop and peel out when you scroll.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap">
<style>
  /* ---------- "Riso" palette ---------- */
  :root {
    --bg: #F4F2FF;
    --ink: #1A1240;      /* main text */
    --ink-2: #4E4777;    /* secondary text, skid marks, smoke */
    --pink: #EC1C7F;
    --blue: #2A47EA;
    --orange: #FF7A00;
    --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }

  /* The full-screen stage */
  .skid {
    position: relative;
    height: 100vh;          /* fallback for older browsers */
    height: 100svh;
    min-height: 540px;
    overflow: hidden;
    background: var(--bg);
    touch-action: pan-y;    /* vertical swipes keep scrolling */
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Transparent drawing surface, purely decorative */
  .skid canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: pan-y;
  }

  /* Invisible scroll area, only switched on when the page itself can't scroll */
  .scroller {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 1;
    display: none;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    touch-action: pan-y;
    outline: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .scroller > div { height: 300%; } /* three screens tall */
  .skid.has-scroller .scroller { display: block; }

  /* Hint + buttons along the top */
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 16px;
    padding: 16px;
    pointer-events: none;   /* let scrolls and clicks reach the stage... */
  }
  .hint {
    margin: 0;
    max-width: 36ch;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 600;
    color: var(--ink-2);    /* 7.6:1 on the background */
  }
  .controls {
    display: flex;
    gap: 8px;
    pointer-events: auto;   /* ...but the buttons stay clickable */
  }
  .controls button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 8px 16px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    background: var(--bg);
    border: 2px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .controls button:hover {
    color: #fff;
    background: var(--blue);
    border-color: var(--blue);
  }
  .controls button:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
  }
  .controls svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex: none;
  }
  .controls svg[hidden] { display: none; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<main>
  <section class="skid" id="skid" aria-labelledby="skid-title">
    <h1 class="sr-only" id="skid-title">skid</h1>

    <canvas id="skid-canvas" aria-hidden="true"></canvas>

    <div class="scroller" id="skid-scroller" aria-hidden="true" tabindex="-1"><div></div></div>

    <div class="bar">
      <p class="hint">Scroll down to peel out, scroll up to bring it back. Click or tap to replay.</p>
      <div class="controls">
        <button type="button" id="skid-replay">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.6 1.4v4.2H9.4z"/></svg>
          Replay
        </button>
        <button type="button" id="skid-play">
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 2.2v11.6c0 .8.9 1.3 1.6.8l8.6-5.8c.6-.4.6-1.2 0-1.6L5.6 1.4C4.9.9 4 1.4 4 2.2z"/></svg>
          <span class="label">Pause</span><span class="sr-only"> animation</span>
        </button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  /* =========================================================
     Settings — every number here comes from the brief
     ========================================================= */
  const TEXT = 'skid';
  const INK = '#1A1240';
  const INK_2 = '#4E4777';
  const FAMILY = '"Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  const DEG = Math.PI / 180;

  const ENTRY_SPEED = 40;     // px per frame (× f) while driving in
  const IN_STAGGER = 0.09;    // s between letters starting their drive
  const SKID_LEAD = 160;      // the skid starts this many px short of the parked spot
  const OVERSHOOT = 0.35;     // ...and slides this many letter-widths past it
  const SETTLE_TIME = 0.35;   // s to roll back onto the spot
  const TILT = 12 * DEG;      // biggest lean
  const SQUASH = 0.18;
  const TIRE = 0.28;          // tyres sit ± this many letter-widths from the centre

  const MARK_LIFE = 2.5, MARK_ALPHA = 0.35, MARK_WIDTH = 3, STILL_MARK_ALPHA = 0.15;
  const PUFF_LIFE = 1.2, PUFF_R = 14, PUFF_GROWTH = 3, PUFF_RISE = 0.4, PUFF_ALPHA = 0.25, PUFF_CHANCE = 0.5;
  const SHAKE = 0.8, SHAKE_SPEED = 38, SHAKE_OFFSET = 1.7;
  const PEEL_ACCEL = 1.2, PEEL_STAGGER = 0.06;
  const SCROLL_CLAMP = 140, SCROLL_SMOOTH = 0.2, SCROLL_TRIGGER = 4;

  /* =========================================================
     Elements
     ========================================================= */
  const section = document.getElementById('skid');
  const canvas = document.getElementById('skid-canvas');
  const scroller = document.getElementById('skid-scroller');
  const playBtn = document.getElementById('skid-play');
  const replayBtn = document.getElementById('skid-replay');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const reduceMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false };

  /* =========================================================
     State
     ========================================================= */
  let W = 0, H = 0, dpr = 1;   // canvas size in CSS pixels, and pixel ratio
  let baselineY = 0;
  let laidOut = false;
  let group = 'none';          // 'in' (arriving or parked) | 'leaving' | 'out'

  // One "car" per letter. state: wait → drive → skid → settle → parked, or → peel → out
  const letters = Array.from(TEXT, (ch, i) => ({
    ch, i,
    w: 0, target: 0, x: 0,
    state: 'wait', start: Infinity, peelAt: -1,
    x0: 0, prevX: 0, skidT0: 0, skidDur: 1, p: 0,
    settleT0: 0, speed: 0
  }));
  const marks = [];  // skid-mark segments { t, ax, bx, y }, oldest first
  const puffs = [];  // smoke puffs { t, x, y }, oldest first

  let t = 0;               // seconds the loop has run
  let lastNow = -1;
  let rafId = 0;
  let playing = !reduceMotion.matches;
  let onScreen = true;
  let replayQueued = false;
  let lastScroll = null;
  let velocity = 0;
  let ownScroller = false; // true when the section uses its own invisible scroller
  let jumped = 0;          // total distance the scroller has quietly jumped

  /* =========================================================
     Helpers
     ========================================================= */
  const easeOutQuad = (p) => 1 - (1 - p) * (1 - p);
  const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const skidEnd = (L) => L.target + OVERSHOOT * L.w;
  const startX = (L) => -1.5 * L.w; // right edge one letter-width beyond the left edge

  function setFont(size) {
    const px = size.toFixed(2) + 'px ';
    ctx.font = '900 ' + px + FAMILY;
    ctx.font = '900 expanded ' + px + FAMILY;           // ignored where not understood
    if ('fontStretch' in ctx) ctx.fontStretch = 'expanded';
  }

  function dropOld(list, life) {
    let n = 0;
    while (n < list.length && t - list[n].t >= life) n++;
    if (n) list.splice(0, n);
  }

  /* =========================================================
     Sizing and layout
     ========================================================= */
  function resize() {
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const bw = Math.max(1, Math.round(W * dpr));
    const bh = Math.max(1, Math.round(H * dpr));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    updateScrollMode();
    if (laidOut) layout();
    if (!rafId) paintIdle();
  }

  function layout() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    const gap = (size) => 0.06 * size;
    let size = Math.min(H * 0.34, W * 0.26);
    setFont(size);
    let lineW = ctx.measureText(TEXT).width + (TEXT.length - 1) * gap(size);
    if (lineW > 0.84 * W) {
      size *= (0.84 * W) / lineW;
      setFont(size);
      lineW = ctx.measureText(TEXT).width + (TEXT.length - 1) * gap(size);
    }

    const rowStart = (W - lineW) / 2;
    for (const L of letters) {
      const left = rowStart + ctx.measureText(TEXT.slice(0, L.i)).width + L.i * gap(size);
      L.w = ctx.measureText(L.ch).width;
      L.target = left + L.w / 2;
      if (L.state === 'parked') L.x = L.target;
      else if (L.state === 'wait') L.x = startX(L);
    }

    // Put the middle of the row (between ink top and ink bottom) at 50% height
    const m = ctx.measureText(TEXT);
    const ascent = m.actualBoundingBoxAscent || size * 0.72;
    const descent = m.actualBoundingBoxDescent || 0;
    baselineY = H / 2 + (ascent - descent) / 2;

    ctx.globalCompositeOperation = 'multiply'; // overlapping ink multiplies, like riso
    ctx.lineCap = 'butt';
    laidOut = true;
  }

  /* =========================================================
     Entrance and exit
     ========================================================= */
  function beginEntrance(t0) {
    group = 'in';
    for (const L of letters) {
      L.state = 'wait';
      L.start = t0 + L.i * IN_STAGGER;
      L.peelAt = -1;
      L.x = startX(L);
      L.p = 0;
      L.speed = 0;
    }
  }

  function beginPeel(t0) {
    group = 'leaving';
    for (const L of letters) {
      if (L.state === 'wait') { L.state = 'out'; continue; } // never made it on screen
      if (L.state !== 'out') L.peelAt = t0 + (TEXT.length - 1 - L.i) * PEEL_STAGGER; // rightmost first
    }
  }

  function beginSkid(L, alreadyElapsed) {
    L.state = 'skid';
    L.x0 = L.x;
    L.prevX = L.x;
    L.p = 0;
    L.skidT0 = t - alreadyElapsed;
    const dist = Math.max(1, skidEnd(L) - L.x0);
    L.skidDur = (2 * dist) / (ENTRY_SPEED * 60); // so it starts at its driving speed
  }

  // Rightward speed in px per frame, used when a moving letter is told to peel out
  function currentSpeed(L) {
    if (L.state === 'drive') return ENTRY_SPEED;
    if (L.state === 'skid') return (2 * (skidEnd(L) - L.x0) * (1 - L.p)) / L.skidDur / 60;
    return 0;
  }

  function puff(x) {
    puffs.push({ t, x, y: baselineY });
  }

  /* =========================================================
     Per-frame update
     ========================================================= */
  function readScroll() {
    if (ownScroller) return scroller.scrollTop + jumped;
    return window.pageYOffset || document.documentElement.scrollTop || 0;
  }

  function updateVelocity(dt) {
    const pos = readScroll();
    if (lastScroll === null) lastScroll = pos;
    let raw = (pos - lastScroll) / Math.max(dt * 60, 0.25);
    lastScroll = pos;
    raw = Math.max(-SCROLL_CLAMP, Math.min(SCROLL_CLAMP, raw));
    velocity += (raw - velocity) * SCROLL_SMOOTH;

    if (!laidOut) return;
    if (velocity > SCROLL_TRIGGER && group === 'in') beginPeel(t);
    else if (velocity < -SCROLL_TRIGGER && (group === 'out' || group === 'leaving')) beginEntrance(t);
  }

  function updateLetters(f) {
    for (const L of letters) {
      // Time to peel out?
      if (L.peelAt >= 0 && t >= L.peelAt && L.state !== 'out') {
        L.speed = currentSpeed(L);
        L.state = 'peel';
        L.peelAt = -1;
      }

      // The stages run in order so a letter can move through several in one frame
      if (L.state === 'wait' && t >= L.start) {
        L.state = 'drive';
        L.x = startX(L);
        if (L.x >= L.target - SKID_LEAD) beginSkid(L, 0); // started too close: skid right away
      }

      if (L.state === 'drive') {
        L.x += ENTRY_SPEED * f;
        const over = L.x - (L.target - SKID_LEAD);
        if (over >= 0) {
          L.x -= over;
          beginSkid(L, over / (ENTRY_SPEED * 60)); // carry the leftover time into the skid
        }
      }

      if (L.state === 'skid') {
        L.p = Math.min(1, (t - L.skidT0) / L.skidDur);
        L.x = L.x0 + (skidEnd(L) - L.x0) * easeOutQuad(L.p);
        const tire = TIRE * L.w;
        marks.push(
          { t, ax: L.prevX - tire, bx: L.x - tire, y: baselineY },
          { t, ax: L.prevX + tire, bx: L.x + tire, y: baselineY }
        );
        L.prevX = L.x;
        if (Math.random() < PUFF_CHANCE) puff(L.x - tire); // rear tyre
        if (L.p >= 1) {
          L.state = 'settle';
          L.settleT0 = L.skidT0 + L.skidDur;
        }
      }

      if (L.state === 'settle') {
        const q = Math.min(1, (t - L.settleT0) / SETTLE_TIME);
        const from = skidEnd(L);
        L.x = from + (L.target - from) * easeInOutCubic(q);
        if (q >= 1) L.state = 'parked';
      }

      if (L.state === 'parked') L.x = L.target;

      if (L.state === 'peel') {
        L.speed += PEEL_ACCEL * f;
        L.x += L.speed * f;
        if (Math.random() < Math.min(1, PUFF_CHANCE * 2)) puff(L.x - TIRE * L.w);
        if (L.x - L.w / 2 > W) L.state = 'out';
      }
    }

    if (group === 'leaving' && letters.every((L) => L.state === 'out')) group = 'out';
  }

  function updatePuffs(f) {
    for (const p of puffs) p.y -= PUFF_RISE * f;
  }

  /* =========================================================
     Drawing: skid marks, then smoke, then letters
     ========================================================= */
  function drawMarks() {
    if (!marks.length) return;
    ctx.strokeStyle = INK_2;
    ctx.lineWidth = MARK_WIDTH;
    let batchT = null;
    for (const m of marks) {
      if (m.t !== batchT) { // segments from the same frame share one stroke
        if (batchT !== null) ctx.stroke();
        batchT = m.t;
        ctx.globalAlpha = MARK_ALPHA * (1 - (t - m.t) / MARK_LIFE);
        ctx.beginPath();
      }
      ctx.moveTo(m.ax, m.y);
      ctx.lineTo(m.bx, m.y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawPuffs() {
    if (!puffs.length) return;
    ctx.fillStyle = INK_2;
    let batchT = null, r = 0;
    for (const p of puffs) {
      if (p.t !== batchT) { // puffs from the same frame share one fill
        if (batchT !== null) ctx.fill();
        batchT = p.t;
        const life = (t - p.t) / PUFF_LIFE;
        r = PUFF_R * (1 + (PUFF_GROWTH - 1) * life);
        ctx.globalAlpha = PUFF_ALPHA * (1 - life);
        ctx.beginPath();
      }
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawLetters() {
    ctx.fillStyle = INK;
    for (const L of letters) {
      if (L.state === 'wait' || L.state === 'out') continue;
      let px = L.x, py = baselineY, angle = 0, sx = 1, sy = 1, ox = 0;

      if (L.state === 'parked') {
        py += SHAKE * Math.sin(t * SHAKE_SPEED + L.i * SHAKE_OFFSET); // engine idle
      } else if (L.state === 'skid') {
        const s = Math.sin(Math.PI * L.p);
        angle = TILT * s;              // clockwise
        sx = 1 - SQUASH * s;
        sy = 1 + SQUASH * s;           // pivot: middle of the baseline
      } else if (L.state === 'peel') {
        angle = -(TILT * Math.min(1, L.speed / ENTRY_SPEED)) / 2; // lean back
        ox = TIRE * L.w;
        px = L.x - ox;                 // pivot: rear tyre, so it pops a little wheelie
      }

      const c = Math.cos(angle), s = Math.sin(angle);
      ctx.setTransform(dpr * c * sx, dpr * s * sx, -dpr * s * sy, dpr * c * sy, dpr * px, dpr * py);
      ctx.fillText(L.ch, ox, 0);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!laidOut) return;
    drawMarks();
    drawPuffs();
    drawLetters();
  }

  // Reduced-motion / paused still frame: parked letters with faint tyre marks behind them
  function drawStill() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!laidOut) return;
    ctx.strokeStyle = INK_2;
    ctx.lineWidth = MARK_WIDTH;
    ctx.globalAlpha = STILL_MARK_ALPHA;
    ctx.beginPath();
    for (const L of letters) {
      const tire = TIRE * L.w;
      for (const x of [L.target - tire, L.target + tire]) {
        ctx.moveTo(x - SKID_LEAD, baselineY);
        ctx.lineTo(x, baselineY);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = INK;
    for (const L of letters) ctx.fillText(L.ch, L.target, baselineY);
  }

  function paintIdle() {
    if (playing) render();
    else drawStill();
  }

  /* =========================================================
     The one animation loop
     ========================================================= */
  function frame(now) {
    rafId = requestAnimationFrame(frame);

    let dt = lastNow < 0 ? 0 : (now - lastNow) / 1000;
    lastNow = now;
    dt = Math.min(Math.max(dt, 0), 0.05);
    const f = Math.min(dt * 60, 2.5);
    t += dt;

    if (replayQueued) { // clicks are handled here so a replay starts at this frame's t
      replayQueued = false;
      if (laidOut) beginEntrance(t);
    }

    updateVelocity(dt);

    if (laidOut) {
      updatePuffs(f);
      updateLetters(f);
      dropOld(marks, MARK_LIFE);
      dropOld(puffs, PUFF_LIFE);
    }

    render();
  }

  function syncLoop() {
    const shouldRun = playing && onScreen && !document.hidden;
    if (shouldRun && !rafId) {
      lastNow = -1;
      lastScroll = null; // don't count scrolling that happened while stopped
      velocity = 0;
      rafId = requestAnimationFrame(frame);
    } else if (!shouldRun && rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  /* =========================================================
     Play / Pause
     ========================================================= */
  function setPlaying(on) {
    playing = on;
    playBtn.querySelector('.label').textContent = on ? 'Pause' : 'Play';
    playBtn.querySelector('.icon-pause').hidden = !on;
    playBtn.querySelector('.icon-play').hidden = on;
    if (on) replayQueued = true;
    else drawStill();
    syncLoop();
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  replayBtn.addEventListener('click', () => {
    if (!playing) setPlaying(true);
    else replayQueued = true;
  });

  const onMotionPrefChange = () => {
    if (reduceMotion.matches && playing) setPlaying(false);
  };
  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', onMotionPrefChange);
  else if (reduceMotion.addListener) reduceMotion.addListener(onMotionPrefChange);

  /* =========================================================
     Click / tap to replay (fires on release; swipes don't count)
     ========================================================= */
  section.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (playing) replayQueued = true;
  });

  /* =========================================================
     Scrolling: use the page if it scrolls, otherwise our own scroller
     ========================================================= */
  function updateScrollMode() {
    const pageScroll = document.documentElement.scrollHeight - window.innerHeight;
    const short = pageScroll < window.innerHeight * 0.5;
    if (short !== ownScroller) {
      ownScroller = short;
      section.classList.toggle('has-scroller', short);
      lastScroll = null;
      if (short) {
        jumped = 0;
        scroller.scrollTop = scroller.clientHeight; // start in the middle screen
      }
    } else if (short) {
      // Size changed: re-centre without changing the scroll position we report
      const pos = scroller.scrollTop + jumped;
      scroller.scrollTop = scroller.clientHeight;
      jumped = pos - scroller.scrollTop;
    }
  }

  scroller.addEventListener('scroll', () => {
    const h = scroller.clientHeight;
    const top = scroller.scrollTop;
    const max = scroller.scrollHeight - h;
    if (top < h * 0.5 || top > max - h * 0.5) {
      const pos = top + jumped;
      scroller.scrollTop = top < h * 0.5 ? top + h : top - h; // quietly jump back one screen
      jumped = pos - scroller.scrollTop;
    }
  }, { passive: true });

  /* =========================================================
     Pause when off-screen or in a background tab
     ========================================================= */
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      onScreen = entries[entries.length - 1].isIntersecting;
      syncLoop();
    }).observe(section);
  }
  document.addEventListener('visibilitychange', syncLoop);

  /* =========================================================
     Resize
     ========================================================= */
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(section);
  window.addEventListener('resize', resize);

  /* =========================================================
     Start once the Anybody font is ready (or after 3 s without it)
     ========================================================= */
  let started = false;
  function start() {
    if (started) return;
    started = true;
    layout();
    if (playing) beginEntrance(t); // first entrance begins now, at the loop's current t
    if (!rafId) paintIdle();
  }

  function relayout() {
    if (!started) return;
    layout();
    if (!rafId) paintIdle();
  }

  resize();
  setPlaying(playing); // sets the button label; reduced motion starts paused
  replayQueued = false; // the first entrance is started by the font, not by this

  const fallback = setTimeout(start, 3000);
  const fontLoaded = () => {
    clearTimeout(fallback);
    if (started) relayout();
    else start();
  };
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 100px "Anybody"', TEXT).then(fontLoaded, fontLoaded);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', relayout);
  } else {
    start();
  }
})();
</script>
</body>
