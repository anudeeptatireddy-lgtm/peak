<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Undercurrent · Living wallpaper</title>
  <meta name="description" content="A living wallpaper: thousands of ink-colored particles drift on a slowly shifting current. Press and hold to stir a whirlpool.">
  <meta name="theme-color" content="#F4F2FF">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap">
  <style>
    /* ---------- Riso palette ---------- */
    :root {
      --bg: #F4F2FF;       /* paper */
      --ink: #1A1240;      /* main text */
      --ink-2: #4E4777;    /* secondary text */
      --pink: #EC1C7F;
      --blue: #2A47EA;
      --orange: #FF7A00;
      --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
    }

    /* ---------- Full-screen stage ---------- */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;          /* fallback for older browsers */
      height: 100svh;
      min-height: 540px;
      overflow: hidden;
      background: var(--bg);
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;    /* vertical swipes still scroll the page */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: crosshair;
    }
    .stage canvas.is-stirring { cursor: grabbing; }

    /* ---------- Caption card ---------- */
    .card {
      position: absolute;
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 34rem;
      container-type: inline-size;
      padding: 18px 20px 20px;
      background: rgba(244, 242, 255, 0.92);   /* keeps text contrast high over the trails */
      border: 1px solid rgba(26, 18, 64, 0.14);
      border-radius: 20px;
      box-shadow: 0 14px 40px -20px rgba(26, 18, 64, 0.35);
      pointer-events: none;   /* let presses fall through to the canvas... */
    }
    .card .toggle { pointer-events: auto; }   /* ...except the button */

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 6px;
      font-size: 0.8125rem;
      font-weight: 650;
      font-stretch: 118%;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-2);
    }

    .dots { display: inline-flex; }
    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }
    .dots i + i { margin-left: -5px; }
    .dots i:nth-child(1) { background: var(--pink); }
    .dots i:nth-child(2) { background: var(--blue); }
    .dots i:nth-child(3) { background: var(--orange); }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;                      /* fallback */
      font-size: min(4.25rem, 10.5cqi);     /* scales with the card so it never overflows */
      font-weight: 820;
      font-stretch: 125%;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .lede {
      margin: 0 0 16px;
      max-width: 40ch;
      font-size: 1rem;
      font-weight: 450;
      font-stretch: 96%;
      line-height: 1.5;
      color: var(--ink-2);
    }

    .only-touch { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .only-mouse { display: none; }
      .only-touch { display: inline; }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55em;
      min-height: 44px;
      padding: 0.55em 1.2em 0.55em 1em;
      border: 2px solid transparent;        /* shows up in Windows high-contrast mode */
      border-radius: 999px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      font-stretch: 115%;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .toggle:hover { background: #2C2266; }
    .toggle:active { transform: translateY(1px); }
    .toggle:focus { outline: none; }
    .toggle:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .toggle .icon { width: 14px; height: 14px; fill: currentColor; flex: none; }
    .toggle[data-state="playing"] .icon-play,
    .toggle[data-state="paused"] .icon-pause { display: none; }

    .note {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.4;
      color: var(--ink-2);
    }

    @media (min-width: 720px) {
      .card {
        left: max(40px, env(safe-area-inset-left));
        bottom: max(40px, env(safe-area-inset-bottom));
        padding: 24px 28px 28px;
      }
      .lede { font-size: 1.0625rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-labelledby="title">
      <!-- The drawing surface. It is decoration only, so screen readers skip it. -->
      <canvas id="flow" aria-hidden="true"></canvas>

      <div class="card">
        <p class="eyebrow"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Living wallpaper</p>
        <h1 id="title">Undercurrent</h1>
        <p class="lede">
          Thousands of ink specks drift on a slow, invisible current and leave soft, fading trails.
          <span class="only-mouse">Press and hold</span><span class="only-touch">Touch and hold still</span>
          anywhere to stir a whirlpool.
        </p>
        <div class="controls" id="controls" hidden>
          <button class="toggle" id="toggle" type="button" data-state="playing">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <g class="icon-pause"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></g>
              <path class="icon-play" d="M4.5 2.4v11.2a.9.9 0 0 0 1.37.77l9.1-5.6a.9.9 0 0 0 0-1.54l-9.1-5.6A.9.9 0 0 0 4.5 2.4z"/>
            </svg>
            <span class="toggle-label">Pause</span>
          </button>
          <p class="note" id="motion-note" hidden>Paused because your device asks for reduced motion.</p>
        </div>
        <noscript><p class="note">Turn on JavaScript to see the particles move.</p></noscript>
      </div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';

    // ---------- Setup ----------
    const canvas = document.getElementById('flow');
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;

    const root = document.documentElement;
    const controls = document.getElementById('controls');
    const toggle = document.getElementById('toggle');
    const toggleLabel = toggle.querySelector('.toggle-label');
    const motionNote = document.getElementById('motion-note');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const ACCENTS = ['#EC1C7F', '#2A47EA', '#FF7A00'];
    const S = 0.0026;        // scale of the current
    const SPEED = 1.7;       // pixels per frame at 60 fps
    const HOLD_MS = 250;     // touch: hold this long before stirring
    const HOLD_SLOP = 10;    // touch: moving more than this (px) means "scroll", not "stir"

    let bg = readBackground();
    let W = 0, H = 0, DPR = 0;   // canvas size in CSS pixels, and the pixel ratio used
    let stirRadius = 140;

    // Particles live in flat arrays (fast and memory-friendly).
    let count = 0;
    let px = new Float64Array(0);
    let py = new Float64Array(0);
    let life = new Float64Array(0);

    // Pointer / stir state
    const pointer = { x: 0, y: 0 };
    let stirring = false;
    let activeId = null;
    let holdTimer = 0;
    let holdX = 0, holdY = 0;

    // Loop state
    let rafId = 0;
    let last = -1;
    let loopT = 0;
    let userPaused = reduceMotion.matches;
    let onScreen = true;

    // ---------- Helpers ----------
    function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

    function readBackground() {
      const v = getComputedStyle(root).getPropertyValue('--bg').trim();
      return v || '#F4F2FF';
    }

    function paintBackground() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
    }

    // Random order matters: x, then y, then life.
    function spawn(i) {
      px[i] = Math.random() * W;
      py[i] = Math.random() * H;
      life[i] = 40 + Math.random() * 220;
    }

    function buildParticles() {
      count = Math.round(clamp(W * H / 620, 500, 2200));
      px = new Float64Array(count);
      py = new Float64Array(count);
      life = new Float64Array(count);
      for (let i = 0; i < count; i++) spawn(i);
    }

    // The invisible current: an angle for every point, slowly changing with time t.
    function currentAngle(x, y, t) {
      return Math.sin(x * S + t * 0.23) * 1.9
           + Math.cos(y * S * 1.4 - t * 0.17) * 1.6
           + Math.sin((x - y) * S * 0.6 + t * 0.11) * 1.3;
    }

    // ---------- One frame of drawing ----------
    function step(t, f, stir) {
      // 1) Fade old trails by painting the paper color over everything, a little.
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = Math.min(1, 0.075 * f);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 2) Move every particle, in index order, collecting its step into its color's path.
      const paths = [new Path2D(), new Path2D(), new Path2D()];
      const speed = SPEED * f;
      const R = stirRadius;
      const sx = pointer.x, sy = pointer.y;
      const maxX = W + 5, maxY = H + 5;

      for (let i = 0; i < count; i++) {
        const x = px[i], y = py[i];
        const a = currentAngle(x, y, t);
        let vx = Math.cos(a) * speed;
        let vy = Math.sin(a) * speed;

        if (stir) {
          const dx = x - sx, dy = y - sy;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d > 0 && d < R) {
            // Orbit around the pointer with a slight pull inward, weaker toward the edge.
            const k = (1 - d / R) * f;
            const ux = dx / d, uy = dy / d;
            vx += (-uy * 7 - ux * 1.2) * k;
            vy += (ux * 7 - uy * 1.2) * k;
          }
        }

        const nx = x + vx, ny = y + vy;
        const path = paths[i % 3];
        path.moveTo(x, y);
        path.lineTo(nx, ny);

        px[i] = nx;
        py[i] = ny;
        life[i] -= 1;
        if (life[i] < 0 || nx < -5 || nx > maxX || ny < -5 || ny > maxY) spawn(i);
      }

      // 3) Stroke the three color paths, multiplied like overlapping ink.
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      for (let c = 0; c < 3; c++) {
        ctx.strokeStyle = ACCENTS[c];
        ctx.stroke(paths[c]);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // A meaningful picture for when the animation is not running.
    function drawStill() {
      paintBackground();
      for (let s = 0; s < 70; s++) step(s / 60, 1, false);
    }

    // ---------- Animation loop ----------
    function frame(now) {
      rafId = requestAnimationFrame(frame);
      const dt = last < 0 ? 1 / 60 : Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      loopT += dt;
      const f = Math.min(dt * 60, 2.5);
      step(loopT, f, stirring);
    }

    function shouldRun() {
      return !userPaused && onScreen && !document.hidden && W > 0 && H > 0;
    }

    function syncLoop() {
      if (shouldRun()) {
        if (!rafId) {
          last = -1;
          rafId = requestAnimationFrame(frame);
        }
      } else if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
        endStir();
      }
    }

    // ---------- Size ----------
    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w === W && h === H && dpr === DPR) return;
      W = w; H = h; DPR = dpr;

      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS pixels

      stirRadius = clamp(Math.min(W, H) * 0.35, 140, 280);
      buildParticles();
      paintBackground();
      if (!shouldRun()) drawStill();
      syncLoop();
    }

    function syncBackground() {
      const next = readBackground();
      if (next === bg) return;
      bg = next;
      if (rafId) paintBackground(); else drawStill();
    }

    // ---------- Play / Pause ----------
    function setPaused(paused) {
      userPaused = paused;
      toggle.dataset.state = paused ? 'paused' : 'playing';
      toggleLabel.textContent = paused ? 'Play' : 'Pause';
      syncLoop();
    }

    toggle.addEventListener('click', () => {
      motionNote.hidden = true;
      setPaused(!userPaused);
    });

    function onMotionPreference() {
      if (reduceMotion.matches) {
        setPaused(true);
        motionNote.hidden = false;
        drawStill();
      } else {
        motionNote.hidden = true;
        setPaused(false);
      }
    }
    if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', onMotionPreference);
    else if (reduceMotion.addListener) reduceMotion.addListener(onMotionPreference);

    // ---------- Stir (mouse and touch) ----------
    function setPointer(e) {
      const r = canvas.getBoundingClientRect();
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
    }

    function beginStir() {
      stirring = true;
      canvas.classList.add('is-stirring');
    }

    function endStir() {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = 0; }
      stirring = false;
      activeId = null;
      canvas.classList.remove('is-stirring');
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (activeId !== null || !rafId) return;
      activeId = e.pointerId;
      setPointer(e);

      if (e.pointerType === 'touch') {
        // Wait for a still finger, so normal swipes keep scrolling the page.
        holdX = e.clientX;
        holdY = e.clientY;
        holdTimer = setTimeout(() => {
          holdTimer = 0;
          if (activeId !== null && rafId) beginStir();
        }, HOLD_MS);
      } else {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        e.preventDefault();
        beginStir();
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== activeId) return;
      setPointer(e);
      if (holdTimer && Math.hypot(e.clientX - holdX, e.clientY - holdY) > HOLD_SLOP) {
        endStir();   // the finger moved: it's a swipe, not a stir
      }
    });

    const release = (e) => { if (e.pointerId === activeId) endStir(); };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);   // e.g. the browser started scrolling
    canvas.addEventListener('lostpointercapture', release);

    // Once stirring, keep the page still under the finger.
    canvas.addEventListener('touchmove', (e) => {
      if (stirring && e.cancelable) e.preventDefault();
    }, { passive: false });

    // A long press shouldn't open a menu while stirring.
    canvas.addEventListener('contextmenu', (e) => {
      if (activeId !== null) e.preventDefault();
    });

    window.addEventListener('blur', endStir);

    // ---------- Watchers ----------
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas);
    window.addEventListener('resize', resize);   // also catches pixel-ratio (zoom) changes

    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        onScreen = entries[entries.length - 1].isIntersecting;
        syncLoop();
      }).observe(canvas);
    }

    document.addEventListener('visibilitychange', syncLoop);

    new MutationObserver(syncBackground).observe(root, {
      attributes: true,
      attributeFilter: ['style', 'class', 'data-theme']
    });

    // ---------- Start ----------
    controls.hidden = false;
    motionNote.hidden = !reduceMotion.matches;
    setPaused(userPaused);
    resize();
  })();
  </script>
</body>
</html>
