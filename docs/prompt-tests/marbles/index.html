<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text to marbles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap">
  <style>
    :root {
      /* "Riso" palette */
      --bg: #F4F2FF;
      --ink: #1A1240;
      --ink-2: #4E4777;
      --pink: #EC1C7F;
      --blue: #2A47EA;
      --orange: #FF7A00;
      --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }

    .stage { position: relative; }

    /* The full-screen, transparent drawing surface. */
    #marbles {
      display: block;
      width: 100%;
      height: 100vh;      /* fallback for older browsers */
      height: 100svh;
      min-height: 540px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y; /* vertical swipes still scroll the page */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hint text and buttons float over the top of the canvas. */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      padding: 20px 24px;
      pointer-events: none; /* clicks fall through to the canvas... */
    }

    .hint {
      margin: 0;
      max-width: 38ch;
      color: var(--ink-2);
      font-size: 1rem;
      font-weight: 500;
      font-stretch: 110%;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 10px;
      pointer-events: auto; /* ...except on the buttons */
    }

    .btn {
      min-width: 7.5em;
      min-height: 44px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      font-stretch: 115%;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .btn:hover { background: #E4E0FF; }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-primary:hover { background: #2E2463; }
    .btn:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .btn:active { transform: translateY(1px); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 699px) {
      .hud { padding: 14px 16px; }
      .hint { font-size: 0.95rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-labelledby="headline">
      <h1 id="headline" class="sr-only">marbles</h1>
      <p class="sr-only">The word is drawn with small glass marbles. Use the Shatter button to drop them into a pile, and the Rebuild button to put the word back together.</p>

      <!-- Decorative: hidden from screen readers. -->
      <canvas id="marbles" aria-hidden="true"></canvas>

      <div class="hud">
        <p class="hint" id="hint">Click anywhere to shatter the word.</p>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="toggle-btn">Shatter</button>
          <button type="button" class="btn" id="pause-btn">Pause</button>
        </div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    'use strict';

    /* ------------------------------------------------------------------
       Settings (straight from the brief)
       ------------------------------------------------------------------ */
    var WORD = 'marbles';
    var FONT_STACK = '"Anybody", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
    var BG = '#F4F2FF';
    var TEXT = '#1A1240';
    var ACCENTS = ['#EC1C7F', '#2A47EA', '#FF7A00'];

    var GRAVITY = 0.5;            // px per frame², scaled by f
    var RESTITUTION = 0.45;       // speed kept along a hit
    var ROLL_FRICTION = 0.985;    // horizontal speed kept per frame on the floor
    var AIR_DRAG = 0.999;         // speed kept per frame while shattered
    var SPRING = 0.08;            // rebuild spring strength
    var SPRING_DAMPING = 0.82;    // rebuild damping
    var PUSH_RADIUS = 70;         // pointer reach, px
    var PUSH_FORCE = 8 * 0.1;     // pointer strength
    var AUTO_REBUILD_SECONDS = 10;
    var HOLD_MS = 250;            // finger must be held still this long to shove
    var TAP_SLOP = 10;            // px a press may wiggle and still count as a click/tap
    var FLOOR_MARBLES = 7;        // reduced-motion still frame: marbles resting on the floor

    /* Shadow uses the darker of background/text, highlight the lighter. */
    function hexToRgb(hex) {
      var v = parseInt(hex.slice(1), 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    function luminance(c) {
      function ch(x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }
      return 0.2126 * ch(c[0]) + 0.7152 * ch(c[1]) + 0.0722 * ch(c[2]);
    }
    var bgRgb = hexToRgb(BG);
    var textRgb = hexToRgb(TEXT);
    var bgIsDarker = luminance(bgRgb) < luminance(textRgb);
    var darkRgb = bgIsDarker ? bgRgb : textRgb;
    var lightRgb = bgIsDarker ? textRgb : bgRgb;
    var SHADOW_COLOR = 'rgba(' + darkRgb.join(',') + ',0.18)';
    var HIGHLIGHT_COLOR = 'rgba(' + lightRgb.join(',') + ',0.75)';

    /* ------------------------------------------------------------------
       Elements
       ------------------------------------------------------------------ */
    var canvas = document.getElementById('marbles');
    var ctx = canvas.getContext('2d');
    var textCanvas = document.createElement('canvas'); // hidden, never added to the page
    var tctx = textCanvas.getContext('2d', { willReadFrequently: true });
    var hintEl = document.getElementById('hint');
    var toggleBtn = document.getElementById('toggle-btn');
    var pauseBtn = document.getElementById('pause-btn');

    /* ------------------------------------------------------------------
       State (all sizes in CSS pixels)
       ------------------------------------------------------------------ */
    var W = 0, H = 0, dpr = 1;
    var R = 8, D = 16;            // marble radius and diameter
    var n = 0;                    // marble count
    var X = new Float32Array(0), Y = new Float32Array(0);    // positions
    var VX = new Float32Array(0), VY = new Float32Array(0);  // velocities
    var HX = new Float32Array(0), HY = new Float32Array(0);  // homes
    var COLOR = new Uint8Array(0);                           // accent index 0..2

    // Spatial hash grid (cell = one diameter)
    var cols = 1, rows = 1;
    var cellStart = new Int32Array(2);
    var cellFill = new Int32Array(1);
    var cellItems = new Int32Array(0);
    var cellOf = new Int32Array(0);

    var WHOLE = 'whole', SHATTERED = 'shattered';
    var mode = WHOLE;
    var shatteredFor = 0;         // seconds spent shattered (for the auto-rebuild)

    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
    var userPaused = reducedMotion.matches;
    var stillFrame = reducedMotion.matches; // showing the reduced-motion still frame
    var onScreen = true;
    var rafId = 0;
    var lastTime = 0;

    // Pointer
    var pointerX = 0, pointerY = 0;
    var mouseOver = false;
    var press = null; // the current press: { id, type, startX, startY, x, y, moved, held, timer }

    /* ------------------------------------------------------------------
       Sampling the headline into marble homes
       ------------------------------------------------------------------ */
    function setFont(c, size) {
      c.font = '900 ' + size + 'px ' + FONT_STACK;
      if ('fontStretch' in c) {
        c.fontStretch = 'expanded';
      } else {
        c.font = '900 expanded ' + size + 'px ' + FONT_STACK; // ignored if not understood
      }
    }

    // Grid points (row by row from the top-left) whose alpha is above 127.
    function collect(data, w, y0, y1, spacing) {
      var pts = [];
      for (var y = Math.ceil(y0 / spacing) * spacing; y < y1; y += spacing) {
        var rowBase = (y - y0) * w;
        for (var x = 0; x < w; x += spacing) {
          if (data[(rowBase + x) * 4 + 3] > 127) pts.push(x, y);
        }
      }
      return pts;
    }

    function resample() {
      if (!W || !H) return;
      var w = W, h = H;
      textCanvas.width = w;
      textCanvas.height = h;

      // Font size, shrunk to fit if needed.
      var size = Math.min(h * 0.42, w * 0.24);
      setFont(tctx, size);
      var maxWidth = w * (w < 700 ? 0.94 : 0.88);
      var textWidth = tctx.measureText(WORD).width;
      if (textWidth > maxWidth) {
        size *= maxWidth / textWidth;
        setFont(tctx, size);
      }
      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';
      tctx.fillStyle = '#000';
      var centerY = h * 0.42;
      tctx.fillText(WORD, w / 2, centerY);

      // Only read the band of rows the text can reach; the rest is empty anyway.
      var y0 = Math.max(0, Math.floor(centerY - size));
      var y1 = Math.min(h, Math.ceil(centerY + size));
      var pts = [];
      var maxCount = w < 700 ? 400 : 900;
      if (y1 > y0) {
        var data = tctx.getImageData(0, y0, w, y1 - y0).data;
        var spacing = Math.round(2 * R * 1.05);
        var maxSpacing = 6 * D;
        pts = collect(data, w, y0, y1, spacing);
        while (pts.length / 2 > maxCount && spacing < maxSpacing) {
          spacing += 1;
          pts = collect(data, w, y0, y1, spacing);
        }
      }
      applyHomes(pts, Math.min(pts.length / 2, maxCount));

      if (stillFrame) {
        placeStillFrame();
      } else if (!rafId) {
        settleWhileStopped();
      }
      draw();
    }

    // Marble i keeps its position, velocity and color and gets home i.
    function applyHomes(pts, count) {
      var nX = new Float32Array(count), nY = new Float32Array(count);
      var nVX = new Float32Array(count), nVY = new Float32Array(count);
      var nHX = new Float32Array(count), nHY = new Float32Array(count);
      var nC = new Uint8Array(count);
      var keep = Math.min(n, count);
      for (var i = 0; i < count; i++) {
        nHX[i] = pts[2 * i];
        nHY[i] = pts[2 * i + 1];
        if (i < keep) {
          nX[i] = X[i]; nY[i] = Y[i];
          nVX[i] = VX[i]; nVY[i] = VY[i];
          nC[i] = COLOR[i];
        } else {
          // New marble: starts at home, picks its accent once.
          nX[i] = nHX[i]; nY[i] = nHY[i];
          nC[i] = Math.floor(Math.random() * 3);
        }
      }
      X = nX; Y = nY; VX = nVX; VY = nVY; HX = nHX; HY = nHY; COLOR = nC;
      n = count;
      cellItems = new Int32Array(n);
      cellOf = new Int32Array(n);
    }

    // Reduced-motion still frame: word assembled, last 7 marbles resting on the floor.
    function placeStillFrame() {
      for (var i = 0; i < n; i++) {
        X[i] = HX[i]; Y[i] = HY[i]; VX[i] = 0; VY[i] = 0;
      }
      var k = Math.min(FLOOR_MARBLES, n);
      var startX = W / 2 - (k * D) / 2 + R;
      for (var m = 0; m < k; m++) {
        var j = n - k + m;
        X[j] = startX + m * D;
        Y[j] = H - R;
      }
      mode = WHOLE;
    }

    // When the loop isn't running, make the frozen picture make sense at the new size.
    function settleWhileStopped() {
      var i;
      if (mode === WHOLE) {
        for (i = 0; i < n; i++) { X[i] = HX[i]; Y[i] = HY[i]; VX[i] = 0; VY[i] = 0; }
      } else {
        for (i = 0; i < n; i++) {
          if (X[i] < R) X[i] = R;
          if (X[i] > W - R) X[i] = W - R;
          if (Y[i] > H - R) Y[i] = H - R;
        }
      }
    }

    /* ------------------------------------------------------------------
       Canvas size
       ------------------------------------------------------------------ */
    function resize() {
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      var newDpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w === W && h === H && newDpr === dpr) return;
      W = w; H = h; dpr = newDpr;

      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels

      R = W < 700 ? 3.5 : 8;
      D = 2 * R;
      cols = Math.max(1, Math.ceil(W / D));
      rows = Math.max(1, Math.ceil(H / D));
      cellStart = new Int32Array(cols * rows + 1);
      cellFill = new Int32Array(cols * rows);

      resample();
    }

    /* ------------------------------------------------------------------
       Physics
       ------------------------------------------------------------------ */
    function pushActive() {
      return mouseOver || (press !== null && press.held);
    }

    function stepRebuild(f) {
      var k = SPRING * f;
      var damp = Math.pow(SPRING_DAMPING, f);
      for (var i = 0; i < n; i++) {
        VX[i] = (VX[i] + (HX[i] - X[i]) * k) * damp;
        VY[i] = (VY[i] + (HY[i] - Y[i]) * k) * damp;
        X[i] += VX[i] * f;
        Y[i] += VY[i] * f;
      }
    }

    function stepShattered(f) {
      var i;

      // 1) Pointer push
      if (pushActive()) {
        for (i = 0; i < n; i++) {
          var dx = X[i] - pointerX, dy = Y[i] - pointerY;
          var d2 = dx * dx + dy * dy;
          if (d2 > 0 && d2 < PUSH_RADIUS * PUSH_RADIUS) {
            var d = Math.sqrt(d2);
            var s = PUSH_FORCE * (1 - d / PUSH_RADIUS) * f;
            VX[i] += (dx / d) * s;
            VY[i] += (dy / d) * s;
          }
        }
      }

      // 2) Gravity
      var g = GRAVITY * f;
      for (i = 0; i < n; i++) VY[i] += g;

      // 3) Air drag
      var drag = Math.pow(AIR_DRAG, f);
      for (i = 0; i < n; i++) { VX[i] *= drag; VY[i] *= drag; }

      // 4) Move
      for (i = 0; i < n; i++) { X[i] += VX[i] * f; Y[i] += VY[i] * f; }

      // 5) Collisions between marbles
      collide();

      // 6) Walls: floor and sides, no ceiling
      var roll = Math.pow(ROLL_FRICTION, f);
      var left = Math.fround(R), right = Math.fround(W - R), floor = Math.fround(H - R);
      for (i = 0; i < n; i++) {
        if (X[i] < left) {
          X[i] = left;
          if (VX[i] < 0) VX[i] = -VX[i] * RESTITUTION;
        } else if (X[i] > right) {
          X[i] = right;
          if (VX[i] > 0) VX[i] = -VX[i] * RESTITUTION;
        }
        if (Y[i] >= floor) {
          Y[i] = floor;
          if (VY[i] > 0) VY[i] = -VY[i] * RESTITUTION;
          VX[i] *= roll;
        }
      }
    }

    function clampCol(c) { return c < 0 ? 0 : (c >= cols ? cols - 1 : c); }
    function clampRow(r) { return r < 0 ? 0 : (r >= rows ? rows - 1 : r); }

    // Rebuild the grid: marbles listed in index order inside each cell.
    function buildGrid() {
      var cells = cols * rows;
      var i, c;
      cellStart.fill(0);
      for (i = 0; i < n; i++) {
        c = clampRow(Math.floor(Y[i] / D)) * cols + clampCol(Math.floor(X[i] / D));
        cellOf[i] = c;
        cellStart[c + 1]++;
      }
      for (c = 0; c < cells; c++) cellStart[c + 1] += cellStart[c];
      cellFill.set(cellStart.subarray(0, cells));
      for (i = 0; i < n; i++) cellItems[cellFill[cellOf[i]]++] = i;
    }

    function collide() {
      buildGrid();
      var m1 = R * R, m2 = R * R;              // mass = radius²
      var invMassSum = 1 / m1 + 1 / m2;
      var share1 = m2 / (m1 + m2), share2 = m1 / (m1 + m2);
      var minDist = R + R, minDist2 = minDist * minDist;

      for (var i = 0; i < n; i++) {
        var cx0 = clampCol(Math.floor((X[i] - D) / D)), cx1 = clampCol(Math.floor((X[i] + D) / D));
        var cy0 = clampRow(Math.floor((Y[i] - D) / D)), cy1 = clampRow(Math.floor((Y[i] + D) / D));
        for (var cy = cy0; cy <= cy1; cy++) {
          for (var cx = cx0; cx <= cx1; cx++) {
            var c = cy * cols + cx;
            for (var k = cellStart[c], end = cellStart[c + 1]; k < end; k++) {
              var j = cellItems[k];
              if (j <= i) continue;
              var dx = X[j] - X[i], dy = Y[j] - Y[i];
              var d2 = dx * dx + dy * dy;
              if (d2 >= minDist2) continue;
              var d = Math.sqrt(d2), nx, ny;
              if (d > 0) { nx = dx / d; ny = dy / d; } else { nx = 1; ny = 0; }

              // Push apart so they just touch, split by mass.
              var overlap = minDist - d;
              X[i] -= nx * overlap * share1; Y[i] -= ny * overlap * share1;
              X[j] += nx * overlap * share2; Y[j] += ny * overlap * share2;

              // Bounce if moving toward each other.
              var vn = (VX[j] - VX[i]) * nx + (VY[j] - VY[i]) * ny;
              if (vn < 0) {
                var impulse = -(1 + RESTITUTION) * vn / invMassSum;
                VX[i] -= (impulse / m1) * nx; VY[i] -= (impulse / m1) * ny;
                VX[j] += (impulse / m2) * nx; VY[j] += (impulse / m2) * ny;
              }
            }
          }
        }
      }
    }

    function step(dt) {
      var f = Math.min(dt * 60, 2.5);
      if (mode === SHATTERED) {
        shatteredFor += dt;
        if (shatteredFor >= AUTO_REBUILD_SECONDS) rebuild();
      }
      if (mode === SHATTERED) stepShattered(f);
      else stepRebuild(f);
    }

    /* ------------------------------------------------------------------
       Drawing: three batched layers
       ------------------------------------------------------------------ */
    var TAU = Math.PI * 2;

    function draw() {
      var i, r = R;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);

      // 1) Shadows: one path
      var so = 0.35 * r;
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        ctx.moveTo(X[i] + r, Y[i] + so);
        ctx.arc(X[i], Y[i] + so, r, 0, TAU);
      }
      ctx.fillStyle = SHADOW_COLOR;
      ctx.fill();

      // 2) Bodies: one path per accent, multiplied like ink
      ctx.globalCompositeOperation = 'multiply';
      for (var c = 0; c < ACCENTS.length; c++) {
        ctx.beginPath();
        for (i = 0; i < n; i++) {
          if (COLOR[i] !== c) continue;
          ctx.moveTo(X[i] + r, Y[i]);
          ctx.arc(X[i], Y[i], r, 0, TAU);
        }
        ctx.fillStyle = ACCENTS[c];
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      // 3) Highlights: one path
      var hr = 0.32 * r, ho = 0.3 * r;
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        ctx.moveTo(X[i] - ho + hr, Y[i] - ho);
        ctx.arc(X[i] - ho, Y[i] - ho, hr, 0, TAU);
      }
      ctx.fillStyle = HIGHLIGHT_COLOR;
      ctx.fill();
    }

    /* ------------------------------------------------------------------
       The one animation loop
       ------------------------------------------------------------------ */
    function shouldRun() {
      return !userPaused && onScreen && !document.hidden;
    }

    function frame(t) {
      rafId = 0;
      var dt = lastTime ? Math.max(0, Math.min((t - lastTime) / 1000, 0.05)) : 1 / 60;
      lastTime = t;
      step(dt);
      draw();
      if (shouldRun()) rafId = requestAnimationFrame(frame);
    }

    function updateLoop() {
      if (shouldRun()) {
        if (!rafId) {
          lastTime = 0;
          rafId = requestAnimationFrame(frame);
        }
      } else if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    /* ------------------------------------------------------------------
       Shatter / rebuild / pause
       ------------------------------------------------------------------ */
    function shatter() {
      for (var i = 0; i < n; i++) {
        VX[i] = (Math.random() - 0.5) * 5;
        VY[i] = -Math.random() * 5;
      }
      mode = SHATTERED;
      shatteredFor = 0;
      updateUI();
    }

    function rebuild() {
      mode = WHOLE;
      updateUI();
    }

    function toggle() {
      if (userPaused) setPaused(false); // an explicit click means "go"
      if (mode === SHATTERED) rebuild();
      else shatter();
    }

    function setPaused(paused) {
      userPaused = paused;
      if (!paused) stillFrame = false;
      updateUI();
      updateLoop();
    }

    function updateUI() {
      var fine = finePointer.matches;
      toggleBtn.textContent = mode === SHATTERED ? 'Rebuild' : 'Shatter';
      pauseBtn.textContent = userPaused ? 'Play' : 'Pause';
      var hint;
      if (stillFrame) {
        hint = 'Paused because your device prefers less motion. Press Play, or ' +
               (fine ? 'click' : 'tap') + ' the word to shatter it.';
      } else if (mode === SHATTERED) {
        hint = fine
          ? 'Move your cursor to shove the pile. Click to rebuild.'
          : 'Press and hold to shove the pile. Tap to rebuild.';
      } else {
        hint = fine ? 'Click anywhere to shatter the word.' : 'Tap to shatter the word.';
      }
      hintEl.textContent = hint;
    }

    toggleBtn.addEventListener('click', toggle);
    pauseBtn.addEventListener('click', function () { setPaused(!userPaused); });

    /* ------------------------------------------------------------------
       Pointer: mouse shoves on hover, a finger after press-and-hold
       ------------------------------------------------------------------ */
    function localPoint(e) {
      var rect = canvas.getBoundingClientRect();
      return [e.clientX - rect.left, e.clientY - rect.top];
    }

    function endPress() {
      if (press) {
        clearTimeout(press.timer);
        press = null;
      }
    }

    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var p = localPoint(e);
      endPress();
      press = { id: e.pointerId, type: e.pointerType, startX: p[0], startY: p[1],
                x: p[0], y: p[1], moved: false, held: false, timer: 0 };
      if (e.pointerType === 'mouse') {
        pointerX = p[0]; pointerY = p[1]; mouseOver = true;
      } else {
        var thisPress = press;
        thisPress.timer = setTimeout(function () {
          if (press === thisPress && !thisPress.moved && mode === SHATTERED) {
            thisPress.held = true;
            pointerX = thisPress.x; pointerY = thisPress.y;
          }
        }, HOLD_MS);
      }
    });

    canvas.addEventListener('pointermove', function (e) {
      var p = localPoint(e);
      if (e.pointerType === 'mouse') {
        pointerX = p[0]; pointerY = p[1]; mouseOver = true;
      }
      if (press && e.pointerId === press.id) {
        press.x = p[0]; press.y = p[1];
        if (Math.hypot(p[0] - press.startX, p[1] - press.startY) > TAP_SLOP) press.moved = true;
        if (press.type !== 'mouse') {
          if (press.held) { pointerX = p[0]; pointerY = p[1]; }
          else if (press.moved) clearTimeout(press.timer); // it's a swipe, not a hold
        }
      }
    });

    canvas.addEventListener('pointerup', function (e) {
      if (!press || e.pointerId !== press.id) return;
      var isTap = !press.moved && !press.held; // a drag or a press-and-hold is not a click
      endPress();
      if (isTap) toggle();
    });

    canvas.addEventListener('pointercancel', function (e) {
      if (press && e.pointerId === press.id) endPress();
    });

    canvas.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'mouse') mouseOver = false;
      if (press && e.pointerId === press.id) endPress();
    });

    // Once a finger is holding (shoving), stop that touch from scrolling the page.
    canvas.addEventListener('touchmove', function (e) {
      if (press && press.held && e.cancelable) e.preventDefault();
    }, { passive: false });

    /* ------------------------------------------------------------------
       Pause when hidden or scrolled away; follow reduced-motion changes
       ------------------------------------------------------------------ */
    document.addEventListener('visibilitychange', updateLoop);

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[entries.length - 1].isIntersecting;
        updateLoop();
      }).observe(canvas);
    }

    function onReducedMotionChange() {
      if (reducedMotion.matches && !userPaused) setPaused(true);
    }
    if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', onReducedMotionChange);
    else if (reducedMotion.addListener) reducedMotion.addListener(onReducedMotionChange);

    function onPointerTypeChange() { updateUI(); }
    if (finePointer.addEventListener) finePointer.addEventListener('change', onPointerTypeChange);
    else if (finePointer.addListener) finePointer.addListener(onPointerTypeChange);

    /* ------------------------------------------------------------------
       Start
       ------------------------------------------------------------------ */
    resize(); // samples the homes; every marble starts at home (or the still frame)

    if ('ResizeObserver' in window) {
      new ResizeObserver(function () { resize(); }).observe(canvas);
    }
    window.addEventListener('resize', resize);

    // Sample again once the Anybody font has loaded.
    if (document.fonts && document.fonts.load) {
      document.fonts.load('900 100px "Anybody"', WORD).then(function () {
        resample();
      }, function () { /* offline: keep the fallback font */ });
    }

    updateUI();
    updateLoop();
  })();
  </script>
</body>
</html>
