<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightning</title>
  <meta name="description" content="Electric arcs jump from your cursor to small glowing nodes and hop on to their neighbours.">
  <meta name="theme-color" content="#F4F2FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&amp;display=swap">
  <style>
    :root {
      color-scheme: light;
      /* "Riso" palette */
      --bg: #F4F2FF;
      --text: #1A1240;
      --text-soft: #4E4777;
      --pink: #EC1C7F;
      --blue: #2A47EA;
      --orange: #FF7A00;
      --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
    }

    body { overflow-x: hidden; }

    /* Full-screen stage: 100svh, never shorter than 540px */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 540px;
      overflow: hidden;
    }

    /* Transparent canvas over the page background */
    #sky {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;               /* vertical swipes still scroll the page */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Text and controls sit on top; clicks pass through to the canvas */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      padding: clamp(16px, 4vw, 48px);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(2.25rem, 10vw, 7rem);
      font-weight: 800;
      font-stretch: 140%;
      line-height: 0.9;
      letter-spacing: -0.015em;
    }

    .hint {
      margin: 0.75rem 0 0;
      max-width: 34ch;
      color: var(--text-soft);
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 450;
      font-stretch: 100%;
      line-height: 1.4;
    }

    .hint-touch { display: none; }
    @media (hover: none) and (pointer: coarse) {
      .hint-mouse { display: none; }
      .hint-touch { display: inline; }
    }

    .toggle {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0.6rem 1.15rem 0.6rem 0.95rem;
      border: 2px solid var(--text);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 650;
      font-stretch: 115%;
      line-height: 1;
      cursor: pointer;
    }
    .toggle:hover { background: var(--text); color: var(--bg); }
    .toggle:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .toggle svg { width: 1em; height: 1em; flex: none; }
    .toggle .icon-play { display: none; }
    .toggle[data-state="paused"] .icon-play { display: block; }
    .toggle[data-state="paused"] .icon-pause { display: none; }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="sky" aria-hidden="true"></canvas>

    <div class="overlay">
      <header>
        <h1>Lightning</h1>
        <p class="hint">
          <span class="hint-mouse">Move your cursor near the dots. Arcs jump to the closest one and hop on to its neighbour.</span>
          <span class="hint-touch">Touch and hold near a dot. Arcs jump to the closest one and hop on to its neighbour.</span>
        </p>
      </header>

      <button class="toggle" id="toggle" type="button" data-state="playing" aria-label="Pause animation">
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/>
          <rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M4 2.2v11.6a.8.8 0 0 0 1.2.7l9.4-5.8a.8.8 0 0 0 0-1.4L5.2 1.5A.8.8 0 0 0 4 2.2z" fill="currentColor"/>
        </svg>
        <span class="label">Pause</span>
      </button>
    </div>
  </main>

  <script>
  (() => {
    'use strict';

    /* ---------- Settings ---------- */
    const ACCENTS = ['#EC1C7F', '#2A47EA', '#FF7A00'];   // pink, blue, orange
    const TEXT = '#1A1240';
    const TEXT_SOFT = '#4E4777';
    const BLEND = 'multiply';            // overlapping colours mix like ink on paper

    const NODE_COUNT = 24;
    const MARGIN = 0.08;                 // keep nodes 8% away from the edges
    const DOT_R = 3;                     // node dot radius (px)
    const GLOW_R = 16;                   // glow halo radius (px)
    const GLOW_DECAY = 0.93;             // glow × 0.93 per 60fps frame

    const ARC_LIFE = 0.3;                // seconds an arc stays visible
    const JAG = 0.3 * 0.6;               // sideways push, as a share of the piece length
    const MAX_LEVELS = 6;
    const SEG = 8;
    const BRANCH_CHANCE = 0.4 * 0.12;
    const BRANCH_LEN = 0.45;
    const BRANCH_ANGLE = 0.6;            // radians
    const BRANCH_LEVEL_DROP = 2;

    const REACH = 200;                   // px an arc can jump
    const EXTRA_HOPS = 1;                // how many times a strike jumps on
    const HOP_FALLOFF = 0.6;             // each hop is 0.6 × as strong

    const STRIKE_GAP = Math.max(0.34, 1 / 2);   // at most 2 strikes a second
    const IDLE_GAP = 2.5;                       // self-strike after 2.5s of quiet
    const MAX_PER_SECOND = 3;                   // hard safety cap

    const HOLD_MS = 250;                 // touch: hold still this long to strike
    const HOLD_SLOP = 10;                // px a finger may wobble while "still"
    const DPR_CAP = 2;
    const TAU = Math.PI * 2;

    /* ---------- Elements & state ---------- */
    const stage = document.querySelector('.stage');
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const button = document.getElementById('toggle');
    const buttonLabel = button.querySelector('.label');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let W = 0, H = 0, dpr = 1;           // canvas size in CSS pixels
    let nodes = [];                      // { x, y, glow, color }
    let arcs = [];                       // { lines, power, hop, color, age }
    let sprites = [];                    // pre-drawn glow halos, one per accent

    let t = 0;                           // animation clock (seconds)
    let lastStrike = -Infinity;
    const recentStrikes = [];            // real timestamps, for the safety cap

    let playing = !reduceMotion.matches; // reduced motion: start paused
    let onScreen = true;
    let rafId = 0;
    let lastFrame = 0;

    const pointer = {
      active: false,                     // true while it should be striking
      clientX: 0, clientY: 0,
      touchId: null, holdTimer: 0, startX: 0, startY: 0
    };

    /* ---------- Helpers ---------- */
    function rgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    // Index of the nearest node to (x, y) within maxDist, skipping indexes in `skip`; -1 if none.
    function nearest(x, y, skip, maxDist) {
      let best = -1;
      let bestD = maxDist * maxDist;
      for (let i = 0; i < nodes.length; i++) {
        if (skip.has(i)) continue;
        const dx = nodes[i].x - x, dy = nodes[i].y - y;
        const d = dx * dx + dy * dy;
        if (d <= bestD) { bestD = d; best = i; }
      }
      return best;
    }

    /* ---------- Jagged lines (midpoint displacement) ---------- */
    function levelsFor(length) {
      return Math.min(MAX_LEVELS, Math.max(1, Math.ceil(Math.log2(length / SEG))));
    }

    // Returns a flat [x0, y0, x1, y1, ...] polyline.
    function jagged(x0, y0, x1, y1, levels) {
      let pts = [x0, y0, x1, y1];
      for (let l = 0; l < levels; l++) {
        const next = [pts[0], pts[1]];
        for (let i = 0; i < pts.length - 2; i += 2) {
          const ax = pts[i], ay = pts[i + 1], bx = pts[i + 2], by = pts[i + 3];
          // push = (random × 2 − 1) × 0.3 × 0.6 × piece length, at right angles to the piece
          const k = (Math.random() * 2 - 1) * JAG;
          next.push((ax + bx) / 2 - (by - ay) * k, (ay + by) / 2 + (bx - ax) * k, bx, by);
        }
        pts = next;
      }
      return pts;
    }

    function makeArc(x0, y0, x1, y1, power, hop) {
      const levels = levelsFor(Math.hypot(x1 - x0, y1 - y0));
      const main = jagged(x0, y0, x1, y1, levels);
      const lines = [main];
      const angle = Math.atan2(y1 - y0, x1 - x0);
      const branchLevels = Math.max(1, levels - BRANCH_LEVEL_DROP);

      // Walk the inner points; now and then grow a side branch.
      for (let i = 2; i < main.length - 2; i += 2) {
        if (Math.random() < BRANCH_CHANCE) {
          const px = main[i], py = main[i + 1];
          const len = BRANCH_LEN * Math.hypot(x1 - px, y1 - py);
          const a = angle + (Math.random() < 0.5 ? -BRANCH_ANGLE : BRANCH_ANGLE);
          lines.push(jagged(px, py, px + Math.cos(a) * len, py + Math.sin(a) * len, branchLevels));
        }
      }
      return { lines, power, hop, color: ACCENTS[hop % 3], age: 0 };
    }

    /* ---------- Strikes ---------- */
    // Arc from (x, y) to the nearest unhit node in reach, then hop on. Returns false if nothing was in reach.
    function strikeFrom(x, y, hit) {
      let target = nearest(x, y, hit, REACH);
      if (target < 0) return false;

      let power = 1;
      for (let hop = 0; ; hop++) {
        const n = nodes[target];
        arcs.push(makeArc(x, y, n.x, n.y, power, hop));
        hit.add(target);
        n.glow = 1;
        n.color = hop % 3;
        if (hop >= EXTRA_HOPS) break;
        const next = nearest(n.x, n.y, hit, REACH);
        if (next < 0) break;
        x = n.x; y = n.y; target = next; power *= HOP_FALLOFF;
      }

      lastStrike = t;
      recentStrikes.push(performance.now());
      return true;
    }

    function underSafetyCap() {
      const now = performance.now();
      while (recentStrikes.length && now - recentStrikes[0] >= 1000) recentStrikes.shift();
      return recentStrikes.length < MAX_PER_SECOND;
    }

    function maybeStrike() {
      if (!nodes.length) return;
      const since = t - lastStrike;
      if (pointer.active) {
        if (since >= STRIKE_GAP && underSafetyCap()) {
          const r = canvas.getBoundingClientRect();
          strikeFrom(pointer.clientX - r.left, pointer.clientY - r.top, new Set());
        }
      } else if (since >= IDLE_GAP && underSafetyCap()) {
        const src = Math.floor(Math.random() * nodes.length);
        strikeFrom(nodes[src].x, nodes[src].y, new Set([src]));
      }
    }

    /* ---------- Simulation step ---------- */
    function step(dt, f) {
      t += dt;

      // 1. age and remove arcs
      for (let i = arcs.length - 1; i >= 0; i--) {
        arcs[i].age += dt;
        if (arcs[i].age >= ARC_LIFE) arcs.splice(i, 1);
      }

      // 2. fade node glows
      const fade = Math.pow(GLOW_DECAY, f);
      for (const n of nodes) {
        if (n.glow) {
          n.glow *= fade;
          if (n.glow < 0.004) n.glow = 0;
        }
      }

      // 3. strike if one is due
      maybeStrike();
    }

    /* ---------- Drawing ---------- */
    function buildSprites() {
      const size = Math.ceil(GLOW_R * 2 * dpr);
      sprites = ACCENTS.map((hex) => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        const r = size / 2;
        const grad = g.createRadialGradient(r, r, 0, r, r, r);
        grad.addColorStop(0, rgba(hex, 0.5));
        grad.addColorStop(1, rgba(hex, 0));
        g.fillStyle = grad;
        g.fillRect(0, 0, size, size);
        return c;
      });
    }

    function tracePath(lines) {
      ctx.beginPath();
      for (const p of lines) {
        ctx.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
      }
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);

      // Node dots, all in one path
      ctx.fillStyle = TEXT_SOFT;
      ctx.beginPath();
      for (const n of nodes) {
        ctx.moveTo(n.x + DOT_R, n.y);
        ctx.arc(n.x, n.y, DOT_R, 0, TAU);
      }
      ctx.fill();

      // Glow halos (radial gradient, colour at glow × 0.5 fading to transparent)
      ctx.globalCompositeOperation = BLEND;
      for (const n of nodes) {
        if (!n.glow) continue;
        ctx.globalAlpha = n.glow;
        ctx.drawImage(sprites[n.color], n.x - GLOW_R, n.y - GLOW_R, GLOW_R * 2, GLOW_R * 2);
      }

      // Hit dots in the arc's colour, at opacity = glow
      ctx.globalCompositeOperation = 'source-over';
      for (const n of nodes) {
        if (!n.glow) continue;
        ctx.globalAlpha = n.glow;
        ctx.fillStyle = ACCENTS[n.color];
        ctx.beginPath();
        ctx.arc(n.x, n.y, DOT_R, 0, TAU);
        ctx.fill();
      }

      // Arcs, drawn after the nodes
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      for (const a of arcs) {
        const alpha = a.power * (1 - a.age / ARC_LIFE);
        if (alpha <= 0) continue;
        const w = 2 * a.power;
        tracePath(a.lines);
        ctx.strokeStyle = a.color;

        if (BLEND === 'lighter') {
          // Soft outer glow, only used with additive ("lighter") blending
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineWidth = w + 9; ctx.globalAlpha = alpha * 0.0889; ctx.stroke();
          ctx.lineWidth = w + 6; ctx.globalAlpha = alpha * 0.178;  ctx.stroke();
          ctx.lineWidth = w + 3; ctx.globalAlpha = alpha * 0.267;  ctx.stroke();
        }

        ctx.globalCompositeOperation = BLEND;
        ctx.lineWidth = w;
        ctx.globalAlpha = alpha;
        ctx.stroke();

        if (BLEND === 'lighter') {
          ctx.strokeStyle = TEXT;
          ctx.lineWidth = w / 2;
          ctx.stroke();
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // Reduced-motion still frame: one full-power arc between two nodes, both glowing.
    function renderStill() {
      arcs = [];
      for (const n of nodes) n.glow = 0;
      const a = nearest(0.3 * W, 0.45 * H, new Set(), Infinity);
      const b = a < 0 ? -1 : nearest(0.7 * W, 0.55 * H, new Set([a]), Infinity);
      if (b >= 0) {
        const A = nodes[a], B = nodes[b];
        arcs.push(makeArc(A.x, A.y, B.x, B.y, 1, 0));
        A.glow = B.glow = 1;
        A.color = B.color = 0;
      }
      draw();
    }

    /* ---------- Size & layout ---------- */
    function scatter() {
      nodes = [];
      for (let i = 0; i < NODE_COUNT; i++) {
        const x = (MARGIN + Math.random() * (1 - 2 * MARGIN)) * W;
        const y = (MARGIN + Math.random() * (1 - 2 * MARGIN)) * H;
        nodes.push({ x, y, glow: 0, color: 0 });
      }
    }

    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const d = Math.min(DPR_CAP, window.devicePixelRatio || 1);
      if (w === W && h === H && d === dpr) return;
      W = w; H = h; dpr = d;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      buildSprites();
      scatter();
      arcs = [];
      if (playing) draw(); else renderStill();
    }

    /* ---------- Animation loop ---------- */
    function shouldRun() {
      return playing && onScreen && !document.hidden;
    }

    function frame(now) {
      const dt = lastFrame ? Math.min(0.05, Math.max(0, (now - lastFrame) / 1000)) : 1 / 60;
      lastFrame = now;
      const f = Math.min(dt * 60, 2.5);
      step(dt, f);
      draw();
      rafId = requestAnimationFrame(frame);
    }

    function updateLoop() {
      if (shouldRun()) {
        if (!rafId) {
          lastFrame = 0;
          rafId = requestAnimationFrame(frame);
        }
      } else if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    function setPlaying(p) {
      playing = p;
      button.dataset.state = p ? 'playing' : 'paused';
      button.setAttribute('aria-label', p ? 'Pause animation' : 'Play animation');
      buttonLabel.textContent = p ? 'Pause' : 'Play';
      updateLoop();
    }

    /* ---------- Pointer: mouse/pen hover, or touch-and-hold ---------- */
    function endTouch() {
      clearTimeout(pointer.holdTimer);
      pointer.holdTimer = 0;
      pointer.touchId = null;
      pointer.active = false;
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch') {
        pointer.active = true;
        pointer.clientX = e.clientX; pointer.clientY = e.clientY;
        return;
      }
      if (pointer.touchId !== null) return;          // ignore extra fingers
      pointer.touchId = e.pointerId;
      pointer.startX = pointer.clientX = e.clientX;
      pointer.startY = pointer.clientY = e.clientY;
      pointer.holdTimer = setTimeout(() => {
        pointer.holdTimer = 0;
        pointer.active = true;                        // held still: start striking
      }, HOLD_MS);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') {
        if (e.pointerId !== pointer.touchId) return;
        if (pointer.active) {
          pointer.clientX = e.clientX; pointer.clientY = e.clientY;
        } else if (Math.hypot(e.clientX - pointer.startX, e.clientY - pointer.startY) > HOLD_SLOP) {
          endTouch();                                 // it's a swipe, let it scroll
        }
        return;
      }
      pointer.active = true;
      pointer.clientX = e.clientX; pointer.clientY = e.clientY;
    });

    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType !== 'touch') pointer.active = false;
    });

    canvas.addEventListener('pointerup', (e) => {
      if (e.pointerId === pointer.touchId) endTouch();
    });

    canvas.addEventListener('pointercancel', (e) => {
      if (e.pointerId === pointer.touchId) endTouch();
    });

    // Only after a deliberate hold does dragging steer the lightning instead of scrolling.
    canvas.addEventListener('touchmove', (e) => {
      if (pointer.active && pointer.touchId !== null) e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('contextmenu', (e) => {
      if (pointer.touchId !== null) e.preventDefault();
    });

    /* ---------- Wiring ---------- */
    button.addEventListener('click', () => setPlaying(!playing));

    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);

    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        onScreen = entries[entries.length - 1].isIntersecting;
        updateLoop();
      }).observe(canvas);
    }
    document.addEventListener('visibilitychange', updateLoop);

    const onMotionChange = () => {
      if (reduceMotion.matches) {
        setPlaying(false);
        renderStill();
      } else {
        setPlaying(true);
      }
    };
    if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', onMotionChange);
    else if (reduceMotion.addListener) reduceMotion.addListener(onMotionChange);

    resize();
    setPlaying(playing);
  })();
  </script>
</body>
</html>
