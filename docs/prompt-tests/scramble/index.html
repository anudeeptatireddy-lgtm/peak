<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decoding Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap">
  <style>
    /* ---------- Colors ("Riso" palette) ---------- */
    :root {
      --bg: #F4F2FF;
      --text: #1A1240;
      --text-2: #4E4777;
      --pink: #EC1C7F;
      --blue: #2A47EA;
      --orange: #FF7A00;
      --font: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    /* ---------- The full-screen section ---------- */
    .decode {
      position: relative;
      height: 100vh;          /* fallback for older browsers */
      height: 100svh;
      min-height: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      overflow: hidden;
      pointer-events: none;   /* the section never blocks scrolling or taps */
    }

    .lines {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    /* ---------- Each line ---------- */
    .line {
      position: relative;
      margin: 0;
      line-height: 1.1;
      text-align: center;
      white-space: pre;
      pointer-events: auto;   /* only the lines react to the pointer */
    }
    .line:first-child {
      font-size: clamp(1.6rem, 7vw, 6rem);
      font-weight: 800;
      font-stretch: 110%;
      color: var(--text);
    }
    .line:not(:first-child) {
      font-size: clamp(1.1rem, 3vw, 2.2rem);
      font-weight: 500;
      font-stretch: 100%;
      color: var(--text-2);
    }

    /* One cell per character: the hidden real letter fixes the width,
       the visible layer sits on top of it in the same grid cell. */
    .ch {
      display: inline-grid;
      justify-items: center;
    }
    .ch > span { grid-area: 1 / 1; }
    .ch > .ghost { visibility: hidden; }
    .ch > .glyph { mix-blend-mode: multiply; }  /* overlapping symbols mix like ink */

    /* Text only screen readers see */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Play / Pause button ---------- */
    .toggle {
      position: absolute;
      right: 16px;
      bottom: 16px;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0.5rem 1.1rem;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      background: var(--bg);
      border: 2px solid var(--text);
      border-radius: 999px;
      cursor: pointer;
    }
    .toggle:hover { background: var(--text); color: var(--bg); }
    .toggle:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .toggle svg { width: 0.9em; height: 0.9em; fill: currentColor; }
  </style>
</head>
<body>
  <main>
    <section class="decode" aria-label="Introduction">
      <div class="lines">
        <!-- Change the words here. An empty line is simply left out. -->
        <h1 class="line">Hi, I'm [YOUR NAME]</h1>
        <p class="line">I make things move</p>
        <p class="line">one letter at a time</p>
      </div>

      <button class="toggle" type="button">
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/></svg>
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 2l10 6-10 6z"/></svg>
        <span class="toggle-label">Pause</span>
      </button>
    </section>
  </main>

  <script>
  (function () {
    "use strict";

    // ---------- Settings ----------
    var CHARSET = "!<>-_\\/[]{}=+*^?#$%&@~"; // symbols shown while scrambling
    var BG = "#F4F2FF";
    var ACCENTS = ["#EC1C7F", "#2A47EA", "#FF7A00"];
    var SCRAMBLE_TIME = 1.2;   // seconds every character scrambles at least
    var PER_CHAR = 0.04;       // extra seconds for each next character
    var LINE_DELAY = 0.25;     // seconds between the start of each line
    var STEP_MS = 50;          // a scrambling character changes every 50ms
    var MAX_DT = 0.05;         // longest time step per frame, in seconds

    // ---------- Color helpers (contrast check) ----------
    function hexToRgb(hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgbToHex(rgb) {
      return "#" + rgb.map(function (v) { return v.toString(16).padStart(2, "0"); }).join("");
    }
    function luminance(rgb) {
      var c = rgb.map(function (v) {
        v /= 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    function contrast(a, b) {
      var la = luminance(a), lb = luminance(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    function rgbToHsl(rgb) {
      var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var l = (max + min) / 2, h = 0, s = 0, d = max - min;
      if (d !== 0) {
        s = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return [h, s, l];
    }
    function hslToRgb(h, s, l) {
      var c = (1 - Math.abs(2 * l - 1)) * s;
      var x = c * (1 - Math.abs((h / 60) % 2 - 1));
      var m = l - c / 2, r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      return [r, g, b].map(function (v) { return Math.round((v + m) * 255); });
    }
    // Keep hue and saturation, change only lightness until contrast >= min.
    function withContrast(hex, bgHex, min) {
      var rgb = hexToRgb(hex), bg = hexToRgb(bgHex);
      if (contrast(rgb, bg) >= min) return hex;
      var hsl = rgbToHsl(rgb);
      var step = luminance(bg) > 0.5 ? -0.005 : 0.005; // darker on a light background
      for (var l = hsl[2]; l >= 0 && l <= 1; l += step) {
        var c = hslToRgb(hsl[0], hsl[1], l);
        if (contrast(c, bg) >= min) return rgbToHex(c);
      }
      return step < 0 ? "#000000" : "#ffffff";
    }
    var accents = ACCENTS.map(function (c) { return withContrast(c, BG, 3); });

    // ---------- Build the lines ----------
    var section = document.querySelector(".decode");
    var button = document.querySelector(".toggle");
    var buttonLabel = button.querySelector(".toggle-label");
    var iconPause = button.querySelector(".icon-pause");
    var iconPlay = button.querySelector(".icon-play");

    var lines = [];
    Array.prototype.forEach.call(section.querySelectorAll(".line"), function (el) {
      var text = el.textContent.trim();
      if (!text) { el.remove(); return; } // leave out empty lines

      var i = lines.length;
      var letters = Array.from(text);
      var chars = [];
      var lastLetter = 0;

      var srText = document.createElement("span");
      srText.className = "sr-only";
      srText.textContent = text;

      var visual = document.createElement("span");
      visual.setAttribute("aria-hidden", "true");

      letters.forEach(function (ch, j) {
        var cell = document.createElement("span");
        cell.className = "ch";
        var ghost = document.createElement("span");
        ghost.className = "ghost";
        ghost.textContent = ch;
        var glyph = document.createElement("span");
        glyph.className = "glyph";
        cell.appendChild(ghost);
        cell.appendChild(glyph);
        visual.appendChild(cell);

        var isSpace = /\s/.test(ch);
        if (!isSpace) lastLetter = j;
        chars.push({
          ch: ch,
          isSpace: isSpace,
          glyph: glyph,
          accent: accents[(i + j) % 3],
          shown: "",
          color: "",
          lastStep: null
        });
      });

      el.textContent = "";
      el.appendChild(srText);
      el.appendChild(visual);

      var line = {
        chars: chars,
        start: LINE_DELAY * i,                              // first decode start
        t0: null,                                           // current decode start
        length: SCRAMBLE_TIME + lastLetter * PER_CHAR       // how long a decode takes
      };
      lines.push(line);

      el.addEventListener("pointerenter", function () { redecode(line); });
    });

    // ---------- Animation state ----------
    var t = 0;              // seconds the loop has run (sum of dt)
    var lastNow = null;     // timestamp of the last frame
    var rafId = 0;
    var paused = false;     // paused by the button (or reduced motion)
    var onScreen = true;    // paused automatically when scrolled away
    var stillFrame = false; // showing the reduced-motion still frame

    // Only touch the page when something actually changes.
    function show(c, text, color) {
      if (c.shown !== text) { c.glyph.textContent = text; c.shown = text; }
      if (c.color !== color) { c.glyph.style.color = color; c.color = color; }
    }

    function startDecode(line, t0) {
      line.t0 = t0;
      for (var j = 0; j < line.chars.length; j++) line.chars[j].lastStep = null;
    }

    function update() {
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.t0 === null) {
          if (t < line.start) continue;   // not started yet: stays blank
          startDecode(line, line.start);
        }
        var t0 = line.t0;
        var step = Math.floor((t - t0) * 1000 / STEP_MS);
        var chars = line.chars;
        for (var j = 0; j < chars.length; j++) {
          var c = chars[j];
          if (c.isSpace || t >= t0 + SCRAMBLE_TIME + j * PER_CHAR) {
            show(c, c.ch, "");            // settled: real letter, line color
          } else if (step !== c.lastStep) {
            c.lastStep = step;
            show(c, CHARSET[Math.floor(Math.random() * CHARSET.length)], c.accent);
          }
        }
      }
    }

    function frame(now) {
      var dt = lastNow === null ? 0 : (now - lastNow) / 1000;
      if (dt < 0) dt = 0;
      if (dt > MAX_DT) dt = MAX_DT;
      lastNow = now;
      t += dt;
      update();
      rafId = requestAnimationFrame(frame);
    }

    // Run the loop only when playing and visible.
    function sync() {
      var shouldRun = !paused && onScreen;
      if (shouldRun && !rafId) {
        rafId = requestAnimationFrame(frame);
      } else if (!shouldRun && rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    }

    function redecode(line) {
      if (paused || line.t0 === null) return;
      if (t >= line.t0 + line.length) startDecode(line, t); // only when the last decode is done
    }

    function settleAll() {
      lines.forEach(function (line) {
        line.t0 = -Infinity;
        line.chars.forEach(function (c) { show(c, c.ch, ""); });
      });
    }

    function resetAll() {
      t = 0;
      lastNow = null;
      lines.forEach(function (line) {
        line.t0 = null;
        line.chars.forEach(function (c) { c.lastStep = null; show(c, "", ""); });
      });
    }

    function setPaused(p) {
      paused = p;
      buttonLabel.textContent = p ? "Play" : "Pause";
      iconPause.hidden = p;
      iconPlay.hidden = !p;
      sync();
    }

    button.addEventListener("click", function () {
      if (paused && stillFrame) { stillFrame = false; resetAll(); } // play the intro from the start
      setPaused(!paused);
    });

    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[entries.length - 1].isIntersecting;
        sync();
      }).observe(section);
    }

    // ---------- Start ----------
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) {
      stillFrame = true;
      settleAll();        // every line fully settled, nothing moving
      setPaused(true);
    } else {
      setPaused(false);
    }
  })();
  </script>
</body>
</html>
