<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moiré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2FF;
    --text: #1A1240;
    --text2: #4E4777;
    --a1: #EC1C7F;
    --a2: #2A47EA;
    --a3: #FF7A00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .stage {
    position: relative;
    height: 100svh;
    height: 100vh;
    height: 100svh;
    min-height: 540px;
    overflow: hidden;
    touch-action: pan-y;
    background: var(--bg);
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: transparent;
    touch-action: pan-y;
  }
  .caption {
    position: absolute; left: 16px; bottom: 16px;
    max-width: min(420px, calc(100% - 32px));
    padding: 14px 18px;
    background: var(--bg);
    border-radius: 12px;
    pointer-events: none;
  }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    line-height: 1;
    color: var(--text);
  }
  p { margin: 0; color: var(--text2); font-size: 1rem; line-height: 1.4; }
  button {
    position: absolute; right: 16px; bottom: 16px;
    min-width: 96px; min-height: 44px;
    padding: 10px 20px;
    font: inherit; font-weight: 700;
    color: var(--bg);
    background: var(--text);
    border: 2px solid var(--text);
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover { background: var(--text2); border-color: var(--text2); }
  button:focus-visible { outline: 3px solid var(--a2); outline-offset: 3px; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="caption">
    <h1>Moiré</h1>
    <p>Move your cursor or drag a finger sideways to slide and turn one layer of rings.</p>
  </div>
  <button type="button" id="toggle" aria-pressed="false">Pause</button>
</main>
<script>
(function () {
  var COLORS = ["#EC1C7F", "#2A47EA", "#FF7A00"];
  var LAYERS = 2;
  var SPACING = 8, LINE = 2;
  var H = 3 / LAYERS;
  var DEG = Math.PI / 180;

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var btn = document.getElementById("toggle");
  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");

  var W = 0, Ht = 0, R = 0, short = 0;
  var ox = 0, oy = 0, turn = 0;
  var pointer = null;
  var running = false, visible = true, userPaused = false;
  var raf = 0, last = 0, t = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    W = r.width; Ht = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(Ht * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.sqrt(W * W + Ht * Ht) / 2;
    short = Math.min(W, Ht);
    draw();
  }

  function rings(color) {
    var maxR = R * 1.1;
    ctx.strokeStyle = color;
    ctx.lineWidth = LINE;
    ctx.beginPath();
    for (var rad = SPACING; rad <= maxR; rad += SPACING) {
      ctx.moveTo(rad, 0);
      ctx.arc(0, 0, rad, 0, Math.PI * 2);
    }
    ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, Ht);
    ctx.globalCompositeOperation = "multiply";
    var cx = W / 2, cy = Ht / 2;
    // layer 1: fixed
    ctx.save();
    ctx.translate(cx, cy);
    rings(COLORS[0]);
    ctx.restore();
    // layer 2: moved and turned about the screen center
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(turn);
    ctx.translate(ox, oy);
    rings(COLORS[1]);
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
  }

  function step(dt, f) {
    var tx, ty, tr;
    if (pointer) {
      tx = (pointer.x - W / 2) * 0.15;
      ty = (pointer.y - Ht / 2) * 0.15;
      var k = (pointer.x - W / 2) / (W / 2);
      tr = 6 * DEG * Math.max(-1, Math.min(1, k));
    } else {
      var a = short * 0.1 * 0.3;
      tx = a * Math.sin(t * 0.3);
      ty = a * Math.sin(t * 0.3 * 1.3 + 1.1);
      tr = 6 * DEG * 0.3 * Math.sin(t * 0.3 * 0.7);
    }
    var share = 1 - Math.pow(1 - 0.08, f);
    var dx = (tx - ox) * share, dy = (ty - oy) * share;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var capSlide = H * SPACING * dt;
    if (dist > capSlide) { dx *= capSlide / dist; dy *= capSlide / dist; }
    ox += dx; oy += dy;
    var dr = (tr - turn) * share;
    var capTurn = H * SPACING / R * dt;
    if (dr > capTurn) dr = capTurn;
    if (dr < -capTurn) dr = -capTurn;
    turn += dr;
  }

  function frame(now) {
    raf = 0;
    if (!running) return;
    var dt = Math.min((now - last) / 1000, 0.05);
    if (dt < 0) dt = 0;
    last = now;
    var f = Math.min(dt * 60, 2.5);
    t += dt;
    step(dt, f);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function update() {
    var should = !userPaused && visible && !document.hidden;
    if (should && !running) {
      running = true;
      last = performance.now();
      if (!raf) raf = requestAnimationFrame(frame);
    } else if (!should && running) {
      running = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }
  }

  function still() {
    ox = 0.35 * SPACING; oy = 0; turn = 3 * DEG;
    draw();
  }

  function setPaused(p) {
    userPaused = p;
    btn.textContent = p ? "Play" : "Pause";
    btn.setAttribute("aria-pressed", p ? "true" : "false");
    btn.setAttribute("aria-label", p ? "Play animation" : "Pause animation");
    if (p && mq.matches) still();
    update();
  }

  btn.addEventListener("click", function () { setPaused(!userPaused); });

  function setPointer(e) {
    var r = canvas.getBoundingClientRect();
    pointer = { x: e.clientX - r.left, y: e.clientY - r.top };
    if (!running && !userPaused) update();
  }
  stage.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") return;
    setPointer(e);
  });
  stage.addEventListener("pointerenter", function (e) {
    if (e.pointerType !== "touch") setPointer(e);
  });
  stage.addEventListener("pointerleave", function (e) {
    if (e.pointerType !== "touch") pointer = null;
  });
  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch") setPointer(e);
  });
  stage.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") setPointer(e);
  });
  function endTouch(e) { if (e.pointerType === "touch") pointer = null; }
  stage.addEventListener("pointerup", endTouch);
  stage.addEventListener("pointercancel", endTouch);

  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      update();
    }, { threshold: 0 }).observe(stage);
  }
  document.addEventListener("visibilitychange", update);
  window.addEventListener("resize", resize);

  resize();
  if (mq.matches) {
    setPaused(true);
    still();
  } else {
    setPaused(false);
  }
  if (mq.addEventListener) {
    mq.addEventListener("change", function (e) {
      if (e.matches) { setPaused(true); still(); }
    });
  }
})();
</script>
</body>
</html>
