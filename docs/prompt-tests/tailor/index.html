<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailor's cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2FF;
    --text: #1A1240;
    --text2: #4E4777;
    --a1: #EC1C7F;
    --a2: #2A47EA;
    --a3: #FF7A00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Anybody", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .stage { position: relative; width: 100%; height: max(100svh, 540px); overflow: hidden; touch-action: pan-y; background: var(--bg); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; touch-action: pan-y; }
  .controls { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 10px; z-index: 2; }
  button { font: 700 16px/1 "Anybody", system-ui, sans-serif; color: var(--bg); background: var(--text); border: 2px solid var(--text); border-radius: 999px; padding: 12px 20px; min-height: 44px; cursor: pointer; }
  button:hover { background: var(--text2); border-color: var(--text2); }
  button:focus-visible { outline: 3px solid var(--a2); outline-offset: 3px; }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Tailor's cut: a cloth is cut open to reveal the name "Your brand"</h1>
  <div class="stage" id="stage">
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="controls">
      <button type="button" id="playBtn" aria-pressed="false">Pause</button>
      <button type="button" id="restartBtn">Restart</button>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';

  var COL_BG = '#F4F2FF', COL_TEXT = '#1A1240', COL_A1 = '#EC1C7F';
  var NAME = 'Your brand';
  var WEIGHT = 0.5;
  var GRAVITY = 0.25 + (0.9 - 0.25) * WEIGHT;
  var DRAG = 0.99 + (0.97 - 0.99) * WEIGHT;

  var T_HANG = 0.4, T_CHALK = 0.6, T_CUT = 1.4, T_PAUSE = 0.35;
  var CUT_START = T_HANG + T_CHALK;
  var CUT_END = CUT_START + T_CUT;
  var LIFT_START = CUT_END + T_PAUSE;
  var STILL_T = LIFT_START + 0.6;
  var BITES = 8;
  var SHADES = 8;

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('playBtn');
  var restartBtn = document.getElementById('restartBtn');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  var W = 0, H = 0, dpr = 1;
  var cols, rows, jc, sx, sy;
  var pts, links, cells, threads;
  var t, lastBite, liftSpeed, threadsMade, topGone, bottomGone;
  var playing = !reduced.matches;
  var visible = true;
  var raf = 0, lastTime = 0;

  var pointer = { x: 0, y: 0, lastX: 0, active: false, has: false };

  // ---- colors ----
  function hexToRgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function mix(a, b, k) {
    var A = hexToRgb(a), B = hexToRgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * k) + ',' + Math.round(A[1] + (B[1] - A[1]) * k) + ',' + Math.round(A[2] + (B[2] - A[2]) * k) + ')';
  }
  var shadeColors = [];
  for (var s = 0; s < SHADES; s++) shadeColors.push(mix(COL_A1, COL_TEXT, s / (SHADES - 1)));
  var threadColor = mix(COL_A1, COL_TEXT, 0.5);

  function smoothstep(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

  // ---- setup ----
  function measure() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, r.width);
    H = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    var cw = W * 0.9, ch = H * 0.92;
    cols = W < 700 ? 20 : 36;
    sx = cw / (cols - 1);
    rows = Math.max(4, Math.round(ch / sx) + 1);
    sy = ch / (rows - 1);
    jc = Math.round(rows * 0.5);
    if (jc > rows - 2) jc = rows - 2;
    if (jc < 0) jc = 0;
    var x0 = (W - cw) / 2, y0 = (H - ch) / 2;

    pts = [];
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < cols; i++) {
        var x = x0 + i * sx, y = y0 + j * sy;
        pts.push({ x: x, y: y, px: x, py: y, i: i, j: j, pinned: j === 0, gone: false, top: j <= jc });
      }
    }
    links = [];
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        var a = pts[j * cols + i];
        if (i < cols - 1) links.push({ a: a, b: pts[j * cols + i + 1], rest: sx, dead: false, col: i, cross: false });
        if (j < rows - 1) {
          var b = pts[(j + 1) * cols + i];
          links.push({ a: a, b: b, rest: sy, dead: false, col: i, cross: j === jc });
        }
      }
    }
    cells = [];
    for (j = 0; j < rows - 1; j++) {
      if (j === jc) continue; // straddles the cut: never drawn
      for (i = 0; i < cols - 1; i++) {
        cells.push({
          p00: pts[j * cols + i], p10: pts[j * cols + i + 1],
          p11: pts[(j + 1) * cols + i + 1], p01: pts[(j + 1) * cols + i]
        });
      }
    }
    threads = [];
    t = 0; lastBite = -1; liftSpeed = 1; threadsMade = false; topGone = false; bottomGone = false;
    pointer.lastX = pointer.x;
  }

  // ---- simulation ----
  function front() {
    if (t < CUT_START) return 0;
    if (t >= CUT_END) return cols;
    var local = (t - CUT_START) / T_CUT * BITES;
    var k = Math.min(BITES - 1, Math.floor(local));
    var fr = local - k;
    return (k + smoothstep(fr / 0.6)) * cols / BITES;
  }
  function biteIndex() {
    if (t < CUT_START) return -1;
    if (t >= CUT_END) return BITES;
    return Math.min(BITES - 1, Math.floor((t - CUT_START) / T_CUT * BITES));
  }

  function makeThreads() {
    for (var n = 0; n < 12; n++) {
      var c = Math.floor(Math.random() * cols);
      var anchor = pts[jc * cols + c];
      var chain = [];
      for (var m = 0; m < 5; m++) {
        var x = anchor.x, y = anchor.y + m * 14;
        chain.push({ x: x, y: y, px: x, py: y });
      }
      threads.push(chain);
    }
  }

  function step(dt) {
    var f = Math.min(dt * 60, 2.5);
    t += dt;

    // breeze
    var dx = pointer.x - pointer.lastX;
    pointer.lastX = pointer.x;
    var breeze = t < CUT_START && pointer.active && pointer.has;

    // cut front and bites
    var fr = front();
    var bi = biteIndex();
    if (bi > lastBite) {
      if (bi >= 0 && bi < BITES) {
        var startFront = bi * cols / BITES;
        for (var q = 0; q < pts.length; q++) {
          var p0 = pts[q];
          if (!p0.pinned && !p0.gone && Math.abs(p0.i - startFront) <= 4) p0.y += 3;
        }
      }
      lastBite = bi;
    }
    for (var l = 0; l < links.length; l++) {
      var lk = links[l];
      if (lk.cross && !lk.dead && lk.col < fr) lk.dead = true;
    }

    // lift
    var lifting = t >= LIFT_START;
    if (lifting && !topGone) {
      for (var c = 0; c < cols; c++) {
        var tp = pts[c];
        tp.y -= liftSpeed * f;
        tp.py = tp.y;
      }
      liftSpeed += 0.12 * f;
    }

    // verlet
    var g = GRAVITY * f * f;
    for (var n = 0; n < pts.length; n++) {
      var p = pts[n];
      if (p.gone || p.pinned) continue;
      var vx = (p.x - p.px) * DRAG, vy = (p.y - p.py) * DRAG;
      p.px = p.x; p.py = p.y;
      var sway = 0.04 * Math.sin(t * 1.1 - (p.i + p.j) * 0.2);
      p.x += vx + sway * f * f;
      p.y += vy + g;
      if (breeze) {
        var ddx = p.x - pointer.x, ddy = p.y - pointer.y;
        var d = Math.sqrt(ddx * ddx + ddy * ddy);
        if (d < 140) p.x += dx * 0.5 * (1 - d / 140);
      }
    }

    // relax links
    for (var it = 0; it < 8; it++) {
      for (var k = 0; k < links.length; k++) {
        var L = links[k];
        if (L.dead) continue;
        var a = L.a, b = L.b;
        if (a.gone || b.gone) continue;
        var ex = b.x - a.x, ey = b.y - a.y;
        var dist = Math.sqrt(ex * ex + ey * ey) || 0.0001;
        var diff = (dist - L.rest) / dist;
        var ox = ex * diff, oy = ey * diff;
        if (a.pinned && b.pinned) continue;
        if (a.pinned) { b.x -= ox; b.y -= oy; }
        else if (b.pinned) { a.x += ox; a.y += oy; }
        else { a.x += ox * 0.5; a.y += oy * 0.5; b.x -= ox * 0.5; b.y -= oy * 0.5; }
      }
    }

    // threads
    if (t >= CUT_END && !threadsMade) { threadsMade = true; makeThreads(); }
    var tg = 0.05 * f * f;
    for (var h = threads.length - 1; h >= 0; h--) {
      var ch = threads[h];
      var offscreen = true;
      for (var m = 0; m < ch.length; m++) {
        var tp2 = ch[m];
        var tvx = (tp2.x - tp2.px) * 0.95, tvy = (tp2.y - tp2.py) * 0.95;
        tp2.px = tp2.x; tp2.py = tp2.y;
        tp2.x += tvx; tp2.y += tvy + tg;
        if (tp2.y < H + 100) offscreen = false;
      }
      for (var r = 0; r < 3; r++) {
        for (m = 0; m < ch.length - 1; m++) {
          var u = ch[m], v = ch[m + 1];
          var ux = v.x - u.x, uy = v.y - u.y;
          var ud = Math.sqrt(ux * ux + uy * uy) || 0.0001;
          var uf = (ud - 14) / ud * 0.5;
          u.x += ux * uf; u.y += uy * uf; v.x -= ux * uf; v.y -= uy * uf;
        }
      }
      if (offscreen) threads.splice(h, 1);
    }

    // retire halves
    if (lifting && !topGone) {
      var allAbove = true;
      for (var n2 = 0; n2 < pts.length; n2++) {
        var tq = pts[n2];
        if (tq.top && tq.y >= 0) { allAbove = false; break; }
      }
      if (allAbove) {
        topGone = true;
        for (n2 = 0; n2 < pts.length; n2++) if (pts[n2].top) pts[n2].gone = true;
      }
    }
    if (t >= CUT_END && !bottomGone) {
      var allBelow = true;
      for (var n3 = 0; n3 < pts.length; n3++) {
        var bq = pts[n3];
        if (!bq.top && bq.y <= H + 200) { allBelow = false; break; }
      }
      if (allBelow) {
        bottomGone = true;
        for (n3 = 0; n3 < pts.length; n3++) if (!pts[n3].top) pts[n3].gone = true;
      }
    }
  }

  // ---- drawing ----
  function drawName() {
    var size = Math.min(H * 0.3, W * 0.9 / NAME.length / 0.75);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = COL_TEXT;
    ctx.font = '900 ' + size + 'px "Anybody", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(NAME, W / 2, H / 2);
  }

  function drawCloth() {
    var paths = [];
    for (var s = 0; s < SHADES; s++) paths.push(new Path2D());
    var used = [];
    var restArea = sx * sy;
    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var a = cell.p00, b = cell.p10, d = cell.p11, e = cell.p01;
      if (a.gone || b.gone || d.gone || e.gone) continue;
      var minY = Math.min(a.y, b.y, d.y, e.y), maxY = Math.max(a.y, b.y, d.y, e.y);
      if (minY > H + 200 || maxY < -200) continue;
      var area = Math.abs((a.x * b.y - b.x * a.y) + (b.x * d.y - d.x * b.y) + (d.x * e.y - e.x * d.y) + (e.x * a.y - a.x * e.y)) / 2;
      var ratio = area / restArea;
      var depth = ratio < 1 ? Math.min(1, 0.6 * (1 - ratio) * 2) : 0;
      var q = Math.round(depth * (SHADES - 1));
      var path = paths[q];
      path.moveTo(a.x, a.y); path.lineTo(b.x, b.y); path.lineTo(d.x, d.y); path.lineTo(e.x, e.y); path.closePath();
      used[q] = true;
    }
    ctx.globalCompositeOperation = 'multiply';
    for (var k = 0; k < SHADES; k++) {
      if (!used[k]) continue;
      ctx.fillStyle = shadeColors[k];
      ctx.fill(paths[k]);
    }
  }

  function drawChalk() {
    if (topGone || t < T_HANG) return;
    var p = Math.min(1, (t - T_HANG) / T_CHALK);
    var reach = p * (cols - 1);
    var n = Math.floor(reach), frac = reach - n;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = COL_BG;
    ctx.lineWidth = 3;
    ctx.lineCap = 'butt';
    ctx.setLineDash([10, 7]);
    ctx.beginPath();
    var base = jc * cols;
    ctx.moveTo(pts[base].x, pts[base].y);
    for (var i = 1; i <= n; i++) ctx.lineTo(pts[base + i].x, pts[base + i].y);
    if (frac > 0 && n < cols - 1) {
      var A = pts[base + n], B = pts[base + n + 1];
      ctx.lineTo(A.x + (B.x - A.x) * frac, A.y + (B.y - A.y) * frac);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawShears() {
    if (topGone || t < CUT_START || t >= LIFT_START) return;
    var fr = Math.max(0, Math.min(cols - 1, front()));
    var i0 = Math.min(cols - 2, Math.floor(fr)), fk = fr - i0;
    var A = pts[jc * cols + i0], B = pts[jc * cols + i0 + 1];
    var px = A.x + (B.x - A.x) * fk, py = A.y + (B.y - A.y) * fk;
    var phase = 0;
    if (t < CUT_END) {
      var local = (t - CUT_START) / T_CUT * BITES;
      phase = local - Math.floor(local);
    }
    var open = 0.4 * (0.5 + 0.5 * Math.cos(phase * Math.PI * 2));
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = COL_TEXT;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var s = -1; s <= 1; s += 2) {
      var ang = s * open / 2;
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(ang) * 70, py + Math.sin(ang) * 70);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fillStyle = COL_TEXT;
    ctx.fill();
  }

  function drawThreads() {
    if (!threads.length) return;
    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = threadColor;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var h = 0; h < threads.length; h++) {
      var ch = threads[h];
      ctx.moveTo(ch[0].x, ch[0].y);
      for (var m = 1; m < ch.length; m++) ctx.lineTo(ch[m].x, ch[m].y);
    }
    ctx.stroke();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawName();
    drawCloth();
    ctx.globalCompositeOperation = 'source-over';
    drawChalk();
    drawShears();
    drawThreads();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- loop ----
  function frame(now) {
    raf = 0;
    if (!playing || !visible || document.hidden) return;
    var dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 1 / 60;
    lastTime = now;
    step(dt);
    render();
    raf = requestAnimationFrame(frame);
  }
  function updateLoop() {
    if (playing && visible && !document.hidden) {
      if (!raf) { lastTime = 0; raf = requestAnimationFrame(frame); }
    } else if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  function renderStill() {
    build();
    while (t < STILL_T) step(1 / 60);
    render();
  }

  function setPlaying(v) {
    playing = v;
    playBtn.textContent = v ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', v ? 'false' : 'true');
    updateLoop();
  }

  function setup(keepState) {
    measure();
    if (!playing && reduced.matches) { renderStill(); }
    else { build(); render(); }
    updateLoop();
  }

  // ---- events ----
  playBtn.addEventListener('click', function () { setPlaying(!playing); if (!playing) render(); });
  restartBtn.addEventListener('click', function () {
    build();
    render();
    setPlaying(true);
  });

  function setPointer(e) {
    var r = stage.getBoundingClientRect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    if (!pointer.has) { pointer.lastX = pointer.x; pointer.has = true; }
  }
  stage.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch' || e.pointerType === 'pen') { if (e.pointerType === 'touch') pointer.active = true; }
    else pointer.active = true;
    setPointer(e);
  });
  stage.addEventListener('pointerdown', function (e) { pointer.active = true; setPointer(e); pointer.lastX = pointer.x; });
  function endPointer(e) { if (e.pointerType === 'touch' || e.type === 'pointerleave') pointer.active = false; }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', function () { pointer.active = false; });
  stage.addEventListener('pointerleave', function (e) { pointer.active = false; pointer.has = false; });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      updateLoop();
    }, { threshold: 0 }).observe(stage);
  }
  document.addEventListener('visibilitychange', updateLoop);

  var resizeTimer = 0, lastW = 0, lastH = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var r = stage.getBoundingClientRect();
      if (Math.abs(r.width - lastW) < 1 && Math.abs(r.height - lastH) < 1) return;
      lastW = r.width; lastH = r.height;
      setup();
    }, 120);
  }
  if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(stage);
  else window.addEventListener('resize', onResize);

  reduced.addEventListener && reduced.addEventListener('change', function (e) {
    if (e.matches) { setPlaying(false); setup(); }
  });

  // ---- start ----
  var r0 = stage.getBoundingClientRect();
  lastW = r0.width; lastH = r0.height;
  setPlaying(playing);
  setup();

  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 40px "Anybody"').then(function () {
      if (!playing) { if (reduced.matches) renderStill(); else render(); }
    });
  }
})();
</script>
</body>
</html>
